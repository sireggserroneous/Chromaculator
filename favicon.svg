<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="chronochromatic">
  <title>chronochromatic</title>
  <!-- the fold at n=3: Inner above the anti-diagonal, Fold on it, Outer below.
       The same three regions the whole site is about, at the smallest size
       where they are still three. -->
  <rect width="48" height="48" rx="7" fill="#0C1015"/>
  <g stroke="#0C1015" stroke-width="1.4">
    <!-- inner -->
    <rect x="6"  y="6"  width="11" height="11" fill="#5E9CFF"/>
    <rect x="18.5" y="6" width="11" height="11" fill="#5E9CFF"/>
    <rect x="6"  y="18.5" width="11" height="11" fill="#5E9CFF"/>
    <!-- the fold, on r+c = n-1 -->
    <rect x="31" y="6"  width="11" height="11" fill="#D9A959"/>
    <rect x="18.5" y="18.5" width="11" height="11" fill="#D9A959"/>
    <rect x="6"  y="31" width="11" height="11" fill="#D9A959"/>
    <!-- outer -->
    <rect x="31" y="18.5" width="11" height="11" fill="#FF6E6E"/>
    <rect x="18.5" y="31" width="11" height="11" fill="#FF6E6E"/>
    <rect x="31" y="31" width="11" height="11" fill="#FF6E6E"/>
  </g>
</svg>
