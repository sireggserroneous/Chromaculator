<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wubba Dub · chronochromatic.org</title>
<meta name="description" content="The wub laid out like a graphing calculator: a pinned gallery of controls and composite waves, then one paged card per integer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/base.css">
<style>
html,body{height:100%}
body{overflow:hidden}
/* every word lives in the left three eighths; the sphere takes the other five,
   and neither of them scrolls the page. */
.stage{position:fixed; top:52px; left:0; right:0; bottom:0;
  display:grid; grid-template-columns:3fr 5fr; gap:14px; padding:12px 16px 16px}
.left{min-height:0; min-width:0; overflow-y:auto; overscroll-behavior:contain;
  scrollbar-gutter:stable; padding-right:6px;
  display:flex; flex-direction:column; gap:11px}
/* an item with its own overflow has an automatic minimum size of zero, so flex
   is free to squash it out of existence. nothing here may shrink. */
.left > *{flex:none}
/* the controls pin to the top of the column and everything else scrolls under
   them. the panel is opaque and casts a small shadow so the tuck reads. */
.left .controls{position:sticky; top:0; z-index:3;
  background:var(--panel); box-shadow:0 7px 16px -10px #000A}
.right{min-height:0; min-width:0; position:relative}
#sph{position:absolute; inset:0; width:100%; height:100%; display:block;
  cursor:grab; touch-action:none}
#sph:active{cursor:grabbing}
.mast{display:flex; flex-direction:column; gap:6px; padding-bottom:10px;
  border-bottom:2px solid var(--ink); flex:none}
h1{font-family:"Zilla Slab",Georgia,serif; font-weight:700; font-size:1.55rem;
  margin:0; letter-spacing:-.02em; line-height:1.05}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--brass); font-weight:600}
.sub{color:var(--ink2); margin:0; font-size:.75rem; line-height:1.5}

.toprow{display:grid; grid-template-columns:minmax(240px,290px) 1fr; gap:18px; align-items:start}
@media (max-width:900px){ .toprow{grid-template-columns:1fr} }
.panel{background:var(--panel); border:1px solid var(--rule); border-radius:3px;
  box-shadow:var(--shadow); padding:14px}
.controls{display:flex; flex-direction:column; gap:12px}
.addrow{display:flex; gap:8px; flex-wrap:wrap}
button{font-family:"IBM Plex Mono",monospace; font-size:.72rem; padding:6px 11px; cursor:pointer;
  touch-action:manipulation;
  background:transparent; color:var(--ink2); border:1px solid var(--rule2); border-radius:2px}
button:hover{border-color:var(--brass); color:var(--brass)}
button.add{border-color:var(--brass); color:var(--brass)}
.addrow button{min-height:44px}
.pinned select, .pinned .chip{min-height:38px; display:inline-flex; align-items:center}
button.ghost{color:var(--ink3)}
.speedrow{display:flex; align-items:center; gap:10px}
label{font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink3); font-weight:600; min-width:52px}
input[type=range]{accent-color:var(--brass); flex:1; min-width:0;
  height:36px; touch-action:manipulation}
/* the bias track shows which way it leans before you read the number */
input[type=range].rb{accent-color:var(--ink3);
  background:linear-gradient(to right, var(--red), var(--rule2) 50%, var(--blue));
  height:5px; border-radius:3px; -webkit-appearance:none; appearance:none}
input[type=range].rb::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px;
  border-radius:50%; background:var(--panel); border:2px solid var(--ink2); cursor:pointer}
input[type=range].rb::-moz-range-thumb{width:13px; height:13px; border-radius:50%;
  background:var(--panel); border:2px solid var(--ink2); cursor:pointer}
.rv{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink2); white-space:nowrap}

/* every card is exactly one row tall, whatever it holds, so a card can never
   change its neighbours' geometry. three rows visible, the rest scrolls. */
.rack{--cardh:152px;
  display:grid; grid-template-columns:1fr;        /* one integer per row */
  grid-auto-rows:var(--cardh); gap:10px; align-items:stretch;
  max-height:calc(var(--cardh)*3 + 20px);
  overflow-y:auto;
  scrollbar-gutter:stable;        /* the bar takes no width when it appears */
  overscroll-behavior:contain;    /* and the wheel stops here, not on the page */
  padding-right:2px}
.row{display:flex; flex-direction:column; gap:5px; padding:8px 9px; height:100%; overflow:hidden;
  background:var(--sunk); border:1px solid var(--rule); border-left:3px solid var(--brass); border-radius:3px}
.row .body{flex:1; min-height:0; overflow:hidden;
  display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:12px}
.form{min-width:0; display:flex; flex-direction:column; gap:3px; justify-content:flex-start}
.rhead,.row .speedrow{flex:none}
.rhead{display:flex; align-items:center; gap:7px}
.rhead input{font-family:"IBM Plex Mono",monospace; font-size:.88rem; width:74px; padding:4px 20px 4px 6px;
  background:var(--panel); color:var(--ink); border:1px solid var(--rule2); border-radius:2px}
.knum{position:relative; display:flex; flex:none}
.kspin{position:absolute; right:3px; top:2px; bottom:2px; display:flex; flex-direction:column; gap:1px}
.kspin button{flex:1; width:14px; padding:0; line-height:1; font-size:.38rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  background:var(--sunk); color:var(--ink3); border:1px solid var(--rule2); border-radius:2px}
.kspin button:hover{color:var(--brass); border-color:var(--brass)}
.kspin button:active{background:var(--brass); color:var(--panel)}
.dot{width:11px; height:11px; border-radius:50%; flex:none}
.rm{margin-left:auto; width:24px; padding:2px 0; text-align:center}
.chip{display:flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",monospace;
  font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); cursor:pointer}
.chip input{accent-color:var(--brass); width:13px; height:13px; margin:0; cursor:pointer}
.chip:has(input:checked){color:var(--brass)}
.forms{display:flex; gap:12px}
.bits{font-family:"IBM Plex Mono",monospace; font-size:.82rem; line-height:1.45; letter-spacing:.04em;
  white-space:nowrap; overflow-x:auto; overflow-y:hidden; scrollbar-width:none}
.bits::-webkit-scrollbar{display:none}
.bits i{font-style:normal}
.bits i.b{color:var(--blue); font-weight:600} .bits i.r{color:var(--red)} .bits i.g{color:var(--green); opacity:.7}
.bits i.cma{color:var(--ink3); padding:0 1px}
.rval{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink2); line-height:1.45;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rval b{color:var(--ink)}
.rval.dim{color:var(--ink3)}

.info{display:flex; flex-direction:column; gap:12px}
.legend{display:flex; gap:15px; flex-wrap:wrap; font-family:"IBM Plex Mono",monospace;
  font-size:.68rem; color:var(--ink2)}
.sw{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}   /* 3 across, 2 down */
.stat{background:var(--panel); border:1px solid var(--rule); border-left:3px solid var(--brass);
  border-radius:3px; padding:10px 12px; display:flex; flex-direction:column; gap:3px; min-width:0}
.skey{font-family:"IBM Plex Mono",monospace; font-size:.58rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink3); font-weight:600}
.sval{font-family:"Zilla Slab",serif; font-size:1.05rem; font-weight:700; line-height:1.15;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sfoot{font-size:.68rem; color:var(--ink3); line-height:1.35}

/* fill down the first column, then the second: the three 1D views stack on
   the left, the three 2D projections on the right. */
.rail{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,auto);
  grid-auto-flow:column; gap:8px; flex:none}
.rail .cap{font-size:.6rem; line-height:1.3}
.rail canvas{width:100%}
.rail figure{background:var(--bar); border:1px solid var(--rule); border-radius:3px; padding:6px}
.zoomrow{display:flex; gap:8px; align-items:center}
.zoomrow input[type=range]{flex:1}
.zoomrow select{font-family:"IBM Plex Mono",monospace; font-size:.66rem; padding:3px 6px;
  background:var(--sunk); color:var(--ink); border:1px solid var(--rule2); border-radius:2px}
.chart{margin:0; display:flex; flex-direction:column; gap:7px}
.chart canvas{width:100%; background:var(--panel); border:1px solid var(--rule); border-radius:3px; display:block}
.rail canvas{aspect-ratio:1.55}
.cap{font-size:.76rem; color:var(--ink3); line-height:1.45}
.cap b{color:var(--ink2)}

/* ---- Wubba Dub: a graphing-calculator column ----
   Pinned at the top: the buttons, then a two-page gallery. Below it the
   variable part, one numbered card per integer, each its own little gallery.
   Dots page both, and only the visible page is ever drawn. */
.left{display:flex; flex-direction:column; gap:0; overflow:hidden; padding-right:0}
.pinned{flex:none; display:flex; flex-direction:column; gap:8px;
  border-bottom:1px solid var(--rule); padding-bottom:9px; margin-bottom:8px}
.gal{display:flex; flex-direction:column; gap:6px}
.galpg{display:flex; flex-direction:column; gap:7px}
.galpg[hidden]{display:none}
.minis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px}
.minis figure{margin:0; display:flex; flex-direction:column; gap:2px; min-width:0}
.minis figure.wide{grid-column:1 / -1}
.minis canvas{width:100%; height:74px; display:block; background:var(--sunk);
  border:1px solid var(--rule); border-radius:2px}
.minis figure.wide canvas{width:min(100%,230px); height:150px; margin:0 auto}
.mcap{font-family:"IBM Plex Mono",monospace; font-size:.55rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink3)}
/* the little dots */
.dots{display:flex; gap:2px; justify-content:center; align-items:center}
/* a 10px dot inside a 34px target -- the dot is what you see, the button is
   what you hit */
.dt{width:34px; height:34px; padding:0; border:0; background:transparent;
  position:relative; cursor:pointer; flex:none; touch-action:manipulation}
.dt::after{content:""; position:absolute; inset:12px; border-radius:50%;
  border:1px solid var(--rule2)}
.dt:hover::after{border-color:var(--brass)}
.dt.on::after{background:var(--brass); border-color:var(--brass)}
.dt:focus-visible{outline:2px solid var(--brass); outline-offset:-4px; border-radius:50%}

/* the variable part */
.cards{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; scrollbar-gutter:stable; padding-right:4px}
.dcard{display:grid; grid-template-columns:30px minmax(0,1fr); align-items:stretch;
  border-bottom:1px solid var(--rule); background:var(--panel)}
.dcard:first-child{border-top:1px solid var(--rule)}
.dcard.sel{background:var(--sunk)}
/* Desmos puts the row number in a gutter; ours carries the colour too */
.dgut{display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 0;
  border-right:1px solid var(--rule); background:var(--sunk)}
.dnum{font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink3)}
.dgut .dot{width:11px; height:11px; border-radius:50%; flex:none}
.dmain{min-width:0; display:flex; flex-direction:column; gap:5px; padding:7px 9px 6px}
.dhead{display:flex; align-items:center; gap:8px}
.dhead .knum{flex:1 1 auto}
.dhead input.kin{width:100%; min-height:44px; font-size:1.02rem; padding:6px 26px 6px 10px}
.kspin button{width:22px; touch-action:manipulation}
.rm{width:44px; min-height:44px; font-size:1rem; touch-action:manipulation; flex:none}
.dpg{display:flex; flex-direction:column; gap:4px; min-height:112px}
.dpg[hidden]{display:none}
.p1{display:flex; flex-direction:column; gap:8px}
.p1 .gcol{align-self:start}
.gcol{min-width:0; overflow:auto} .gcol::-webkit-scrollbar{display:none}
.tcol{min-width:0}
.gsq{display:grid; gap:2px; width:max-content}
.gsc{width:var(--sc,14px); height:var(--sc,14px); display:flex; align-items:center;
  justify-content:center; border-radius:2px; border:1px solid transparent;
  font-family:"IBM Plex Mono",monospace; font-size:calc(var(--sc,14px) * .62);
  font-weight:600; line-height:1}
.gsc.b{background:var(--blue-w); color:var(--blue); border-color:var(--blue)}
.gsc.r{background:var(--red-w); color:var(--red); border-color:var(--red)}
.gsc.g{background:var(--green-w); color:var(--green); border-color:var(--green); opacity:.6}
.gsc.fold{box-shadow:inset 0 0 0 2px var(--brass)}
.gcap{font-family:"IBM Plex Mono",monospace; font-size:.55rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink3); padding-top:3px}
/* plain | pushed | operand, and the operator when it is one */
/* Plain, pushed and the four operators are one choice, not two controls, so
   they are one bar. Everything here is sized for a fingertip: 44px is Apple's
   minimum target and nothing on a card goes under it. */
.seg{display:flex; width:100%; border:1px solid var(--rule2); border-radius:5px;
  overflow:hidden; flex:none}
.sg{flex:1 1 0; min-width:0; min-height:44px; touch-action:manipulation;
  font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.06em;
  text-transform:uppercase; padding:0 4px; border:0; border-right:1px solid var(--rule2);
  background:transparent; color:var(--ink3); cursor:pointer;
  display:flex; align-items:center; justify-content:center}
.sg.op{font-size:1.15rem; letter-spacing:0; flex:0 0 15%}
.sg:last-child{border-right:0}
.sg:hover:not(:disabled){color:var(--ink)}
.sg.on{background:var(--brass); color:var(--panel)}
.sg:disabled{opacity:.28; cursor:default}
.sg:focus-visible{outline:2px solid var(--brass); outline-offset:-2px}
.dgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.dgrid canvas{width:100%; height:88px; display:block; background:var(--sunk);
  border:1px solid var(--rule); border-radius:2px}
.dpg canvas.solo{width:min(100%,230px); height:150px; display:block; margin:0 auto;
  background:var(--sunk); border:1px solid var(--rule); border-radius:2px}
.facts{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 12px;
  font-family:"IBM Plex Mono",monospace; font-size:.78rem; line-height:1.55}
.facts dt{color:var(--ink3); text-transform:uppercase; letter-spacing:.07em; font-size:.6rem;
  align-self:center}
.facts dd{margin:0; color:var(--ink2); min-width:0; overflow-x:auto; white-space:nowrap}
.facts dd::-webkit-scrollbar{display:none}
.facts dd b{color:var(--ink)}
.facts .bits i{font-style:normal}
</style>
</head>

<div class="stage">
  <aside class="left">
    <div class="pinned">
      <div class="addrow">
        <button class="add" id="addbtn">+ Add integer</button>
        <button class="add ghost" id="randbtn">Randomise</button>
        <button class="add ghost" id="resetbtn">Reset</button>
        <button class="add ghost" id="expbtn">Export curve</button>
      </div>

      <div class="gal">
        <div class="galpg" data-p="0">
          <div class="speedrow"><label for="wid">Digits</label>
            <input type="range" id="wid" min="1" max="24" step="1" value="8"
                   aria-label="Quotient cells for division">
            <span class="rv" id="widval">8 cells</span></div>
          <div class="speedrow"><label for="speed">Sweep</label>
            <input type="range" id="speed" min="0" max="1.5" step="0.01" value="0.12"
                   aria-label="Sweep frequency in laps per second">
            <span class="rv" id="speedval">0.12 Hz</span></div>
          <div class="speedrow"><label for="jit">Greens</label>
            <input type="range" id="jit" min="0" max="360" step="1" value="0"
                   aria-label="Green rerolls per lap">
            <span class="rv" id="jitval">frozen</span></div>
          <div class="speedrow"><label for="bias">Bias</label>
            <input type="range" id="bias" class="rb" min="-1" max="1" step="0.02" value="0"
                   aria-label="Green reroll bias, red to blue">
            <span class="rv" id="biasval">50 / 50</span></div>
          <div class="speedrow"><label for="shell">Shell</label>
            <input type="range" id="shell" min="0" max="1" step="0.01" value="0.05"
                   aria-label="Sphere shell opacity">
            <span class="rv" id="shellval">5%</span></div>
          <div class="zoomrow"><label for="zoom">Zoom</label>
            <input type="range" id="zoom" min="0" max="100" step="0.5" value="34" aria-label="Zoom">
            <span class="rv" id="zoomval">1.0×</span></div>
          <div class="zoomrow"><label for="pstyle">Points</label>
            <select id="pstyle" aria-label="How the points are drawn">
              <option value="lights">lights</option>
              <option value="birds">birds</option>
              <option value="flames">flames</option>
            </select>
            <label class="chip" style="margin-left:auto"><input type="checkbox" id="pulse" checked><span>pulse</span></label>
            <label class="chip"><input type="checkbox" id="autospin" checked><span>auto-spin</span></label>
          </div>
        </div>

        <div class="galpg" data-p="1" hidden>
          <div class="minis">
            <figure><canvas id="wavex" role="img" aria-label="Every integer's X"></canvas>
              <figcaption class="mcap">1D · X</figcaption></figure>
            <figure><canvas id="wavey" role="img" aria-label="Every integer's Y"></canvas>
              <figcaption class="mcap">1D · Y</figcaption></figure>
            <figure><canvas id="wavez" role="img" aria-label="Every integer's Z"></canvas>
              <figcaption class="mcap">1D · Z</figcaption></figure>
            <figure><canvas id="wubxy" tabindex="0" role="img" aria-label="The curve down Z"></canvas>
              <figcaption class="mcap">2D · X–Y</figcaption></figure>
            <figure><canvas id="wubyz" tabindex="0" role="img" aria-label="The curve down X"></canvas>
              <figcaption class="mcap">2D · Y–Z</figcaption></figure>
            <figure><canvas id="wubzx" tabindex="0" role="img" aria-label="The curve down Y"></canvas>
              <figcaption class="mcap">2D · Z–X</figcaption></figure>
            <figure class="wide"><canvas id="chelix" role="img" aria-label="Helix of the summed curve"></canvas>
              <figcaption class="mcap">Helix · the summed curve, <span id="windfoot">—</span></figcaption></figure>
          </div>
        </div>

        <div class="dots" id="topdots">
          <button class="dt on" data-p="0" aria-label="Controls"></button>
          <button class="dt" data-p="1" aria-label="Composite waves"></button>
        </div>
      </div>
    </div>

    <div class="cards" id="cards"></div>
  </aside>
  <div class="right">
    <canvas id="sph" tabindex="0" role="img"
      aria-label="A sphere whose radius is the tip's distance"></canvas>
  </div>
</div>

<script src="/stalk.js"></script>
<script>
const $ = id => document.getElementById(id);
const col = k => getComputedStyle(document.body).getPropertyValue(k).trim();
const TAU = Math.PI * 2;
const still = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- one integer -> one phasor ----
   the stalk's three regions each become a channel. a green is undecided, so
   rolling it red-or-blue gives one concrete draw from inside that region's
   range; with no greens the region is a single number and never jitters. */
const wOf = c => c.v * Math.pow(2, -c.w);
const settled = cells => cells.reduce((s, c) => s + wOf(c), 0);
/* a green is undecided, so it is rolled. BIAS leans that coin: -1 always red,
   +1 always blue, 0 an even chance. */
let BIAS = 0;
const coin = () => (Math.random() < (BIAS + 1) / 2 ? 1 : -1);
const rolled = cells => cells.reduce((s, c) =>
  s + (c.v !== 0 ? wOf(c) : coin() * Math.pow(2, -c.w)), 0);
const spreadOf = cells => cells.reduce((s, c) => s + (c.v === 0 ? Math.pow(2, -c.w) : 0), 0);

/* Every card yields exactly one phasor, whether it came from a stalk folded
   into a square or from a rectangle. Both are read the same way: the three
   regions, scaled by whatever ring the running value sits on. */
const runsIn = c => c.reduce((t, d, j) => t + (j && d !== c[j-1] ? 1 : 0), c.length ? 1 : 0);

function stalkPhasor(digits, E, rateA){
  const n = Math.max(1, Math.ceil(Math.sqrt(digits.length)));
  const full = digits.slice();
  while(full.length < n * n) full.push(0);
  const R = hexRegions(full, n);
  const ring = Math.pow(2, E);
  const inner = settled(R.inner) * ring, outer = settled(R.outer) * ring,
        fold  = settled(R.fold)  * ring;
  const value = hexValue(digits);
  return {
    kind: "square", n, R, shown: full, cells: full, ring, E,
    rows: n, cols: n, foldAt: n - 1,
    inner, outer, fold,
    greens: full.filter(d => d === 0).length,
    spread: spreadOf(R.outer) * ring,
    amp: Math.abs(fold) + Math.max(Math.abs(inner), Math.abs(outer)),
    dir: Math.sign(fold) || (value.num < 0n ? -1 : 1),
    /* the hex string is nibble-quantised, so its length alone would put every
       integer under 16 on the same rate. A card that IS an integer passes its
       bit length in; a result of an operation has no such quantisation and its
       own length is the honest rate. */

function gridPhasor(g, E){

        fold  = settled(R.fold)  * ring;

    kind: "grid", n: g.cols, R, shown: g.cells, cells: g.cells, ring, E,
    rows: g.rows, cols: g.cols, foldAt: g.foldAt,
    inner, outer, fold,
    greens: g.cells.filter(d => d === 0).length,
    spread: spreadOf(R.outer) * ring,
    amp: Math.abs(fold) + Math.max(Math.abs(inner), Math.abs(outer)),
    dir: Math.sign(fold) || (value.num < 0n ? -1 : 1),
    rateA: Math.max(1, g.cols),
    rateB: Math.max(1, runsIn(g.cells)),
    value,

/* a curve on a torus that turns p times the long way while turning q times the
   short way is the (p,q) torus knot, provided p and q are coprime. reducing the
   two rates by their gcd makes them coprime, so every phasor is some torus
   knot -- trivial whenever either side reduces to 1. */
function knotOf(p){
  const d = gcd(p.rateA, p.rateB), a = p.rateA / d, b = p.rateB / d;
  const R = Math.abs(p.inner), r = Math.abs(p.outer), f = Math.abs(p.fold);
  /* the (p,q) label only means anything if the curve is actually on a torus.
     these region sums can genuinely be zero, and often are. */
  if(R === 0 && r === 0) return {a, b, kind: "degenerate", name: "a segment — no torus",
    knotted: false, crossings: 0};
  if(r === 0) return {a, b, kind: "flat", name: "unknot — flat circle, no tube",
    knotted: false, crossings: 0};
  if(f === 0) return {a, b, kind: "flat", name: "unknot — flat annulus, no height",
    knotted: false, crossings: 0};
  if(R <= r) return {a, b, kind: "crossing", name: "tube swallows the axis — no type",
    knotted: false, crossings: 0};

  const knotted = lo >= 2;
  const name = !knotted ? "unknot"
    : lo === 2 && hi === 3 ? "trefoil"
    : lo === 2 && hi === 5 ? "cinquefoil"
    : lo === 2 && hi === 7 ? "septafoil"
    : `(${a},${b}) torus knot`;

}

/* ---- crossings of the SUMMED curve ----

   projection instead and keep the best one found: that is an upper bound on
   the real crossing number, never a proof of it. */
function segCross(a, b, c, d){
  const s1 = (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
  const s2 = (b[0]-a[0])*(d[1]-a[1]) - (b[1]-a[1])*(d[0]-a[0]);
  const s3 = (d[0]-c[0])*(a[1]-c[1]) - (d[1]-c[1])*(a[0]-c[0]);
  const s4 = (d[0]-c[0])*(b[1]-c[1]) - (d[1]-c[1])*(b[0]-c[0]);
  return ((s1 > 0) !== (s2 > 0)) && ((s3 > 0) !== (s4 > 0));
}
function crossingsAlong(P, dir){
  const up = Math.abs(dir[2]) > 0.9 ? [1,0,0] : [0,0,1];
  const cr = (x, y) => [x[1]*y[2]-x[2]*y[1], x[2]*y[0]-x[0]*y[2], x[0]*y[1]-x[1]*y[0]];
  const nm = v => { const m = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/m, v[1]/m, v[2]/m]; };
  const u = nm(cr(dir, up)), w = nm(cr(dir, u));
  const Q = P.map(q => [q.x*u[0]+q.y*u[1]+q.z*u[2], q.x*w[0]+q.y*w[1]+q.z*w[2]]);
  const n = Q.length;

  for(let i = 0; i < n; i++){
    const a = Q[i], b = Q[(i+1) % n];
    for(let j = i + 2; j < n; j++){

      if(segCross(a, b, Q[j], Q[(j+1) % n])) c++;

function crossingBound(curve){
  if(curve.length < 4) return 0;
  const step = Math.max(1, Math.floor(curve.length / CROSS_PTS));
  const P = curve.filter((_, i) => i % step === 0);
  let best = Infinity;
  for(let t = 0; t < CROSS_DIRS; t++){                 // spiral of directions
    const z = 2 * (((t + 0.5) * 0.6180339887) % 1) - 1;
    const th = t * 2.39996, rr = Math.sqrt(Math.max(0, 1 - z*z));

function drawPoint(g, x, y, h, size, u, inverted){

  const soft = (a) => `hsla(${H} 80% 62% / ${a})`;

    const r = size * (0.7 + 1.5 * u);

    gr.addColorStop(0, soft(0.85)); gr.addColorStop(0.35, soft(0.28)); gr.addColorStop(1, soft(0));

    g.fillStyle = core;

    const gr = g.createLinearGradient(x, y + size * 0.5, x, y - hgt);
    gr.addColorStop(0, soft(0.7)); gr.addColorStop(0.55, `hsla(${(H + 26) % 360} 90% 62% / .5)`);
    gr.addColorStop(1, soft(0));

    g.quadraticCurveTo(x + size * 0.9, y - hgt * 0.45, x + size * 0.8, y + size * 0.4);

let KS = [{k: 3, pg: 0, mode: "plain", op: "+"},

/* Walk the rack carrying a running value -- a stalk inside (-1,1) and the ring
   it sits on. A plain or pushed card is a number in its own right and starts
   the running value over; an operand card transforms it. Either way the card
   yields exactly one phasor, so every page below works unchanged. */
function model(){
  const P = [];
  let acc = null;
  KS.forEach((e, i) => {
    const mode = i === 0 && e.mode === "op" ? "plain" : (e.mode || "plain");
    const own = ownDigits(e);
    let q = null, note = null;
    if(mode !== "op" || !acc){
      const bits = Math.abs(e.k) ? Math.abs(e.k).toString(2).length : 1;
      q = stalkPhasor(own, 0, bits);
      acc = {d: own, E: 0};
    } else {
      const sym = e.op || "+";
      const opd = ownDigits({k: e.k, mode: "plain"});
      if(sym === "*"){
        const g = hexProduct(acc.d, opd);
        q = gridPhasor(g, acc.E);
        q.grid = g;
        acc = {d: productDigits(g), E: acc.E};
      } else if(sym === "/"){
        const dv = divide(acc.d, opd, WIDTH);
        if(!dv){ note = "nothing divides by green"; }
        else {
          const g = hexProduct(opd, dv.Q);
          q = gridPhasor(g, acc.E + dv.e);
          /* the tableau is B x Q, but the number this card produced is Q --
             that is what the ring carries and what the colour should read */
          q.value = hexValue(dv.Q);
          q.vec = dv.Q;
          q.grid = g; q.rem = dv.R; q.exact = dv.exact; q.step = dv.e; q.Q = dv.Q;
          acc = {d: dv.Q, E: acc.E + dv.e};

        const A = stalkFrac(acc.d, acc.E), B = stalkFrac(opd, 0);
        const n = sym === "+" ? A.num * B.den + B.num * A.den

        const st = fracToStalk(n, A.den * B.den);
        q = stalkPhasor(st.d, st.E);

    else KS[i]._note = note;

    p.phase = TAU * j / N;                 // position in the ring stays positional

    p.nm = nmOf(val);

const angleA = (p, t) => p.phase + p.dir * p.rateA * t;

const angleB = (p, t) => p.phase + (p.dir < 0 ? Math.PI : 0) + p.dir * p.rateB * t;

   reaches north, Outer reaches south. A is longitude, B latitude, so a phasor
   rides an ellipsoid whose two halves have different heights. */
const comp = (p, t) => {
  const A = angleA(p, t), B = angleB(p, t);
  const sB = Math.sin(B), rr = p.fold * Math.cos(B);

  return [rr * Math.cos(A), rr * Math.sin(A), m * sB + d * Math.abs(sB)];

function recompute(){

  AVGX = []; AVGY = []; AVGZ = [];

/* a helix on any canvas: the wave that a sine is one shadow of.

   that is the projection, not a bug -- so the axis is turned partly into the
   screen and the turns overlap. And the shape is built at unit scale and then
   fitted to whatever canvas it is handed, because a tilted helix spreads much
   further vertically than its radius suggests and any fixed constant either
   overflows a short box or rattles around in a tall one. */
function helixOn(cv, freq, colour, t){
  if(!cv || !cv.getContext) return;
  const {ctx: g, W, H} = fitCanvas(cv);
  if(!(freq > 0)) return;

  const ca = Math.cos(spin), sa = Math.sin(spin);
  const TL = 0.55, ct = Math.cos(TL), st = Math.sin(TL);
  /* the spectrometer's proportions, which is what makes a small one read: a
     short axis and a fat tube, so the turns overlap however many there are.
     L/R = 2 there (52px axis, 26px radius in a 129x86 box). Fixed, not
     per-turn -- more turns tighten the spring rather than stretching it. */

    if(q.y < lo.y) lo.y = q.y; if(q.y > hi.y) hi.y = q.y;

    g.beginPath(); g.moveTo(PX(a2), PY(a2)); g.lineTo(PX(b2), PY(b2)); g.stroke();

/* how many times the summed curve winds about the vertical in one period --
   a real count, so the composite helix has a frequency to draw */
function windingOf(){
  let total = 0, prev = null;
  for(const q of CURVE){
    const a = Math.atan2(q.y, q.x);
    if(prev !== null){

      while(d > Math.PI) d -= TAU;
      while(d < -Math.PI) d += TAU;
      total += d;
    }
    prev = a;
  }
  return Math.max(1, Math.round(Math.abs(total) / TAU));
}

function card1D(cv, j, TRACES){

  const pad = 6, w = W - pad*2, h = H - pad*2, cy = pad + h/2;

  ctx.strokeStyle = M.P[j].col; ctx.lineWidth = 1.4; ctx.beginPath();

  ctx.lineWidth = 1.3; ctx.globalAlpha = .78;
  M.P.forEach((p, j) => {
    ctx.strokeStyle = p.col; ctx.beginPath();
    TRACES[j].forEach((y, i) => i ? ctx.lineTo(X(i), Y(y)) : ctx.moveTo(X(i), Y(y)));
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.strokeStyle = col("--ink"); ctx.lineWidth = 2.4; ctx.beginPath();
  AVGS.forEach((y, i) => i ? ctx.lineTo(X(i), Y(y)) : ctx.moveTo(X(i), Y(y)));
  ctx.stroke();
  const px = pad + frac()*w, idx = Math.round(frac()*SAMPLES);
  ctx.strokeStyle = col("--ink3"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px, pad); ctx.lineTo(px, H-pad); ctx.stroke();
  M.P.forEach((p, j) => { ctx.beginPath(); ctx.arc(px, Y(TRACES[j][idx]), 3, 0, 7);
    ctx.fillStyle = p.col; ctx.fill(); });
  ctx.beginPath(); ctx.arc(px, Y(AVGS[idx]), 4.5, 0, 7);
  ctx.fillStyle = col("--ink"); ctx.strokeStyle = col("--panel"); ctx.lineWidth = 2;
  ctx.fill(); ctx.stroke();
}

/* each projection scales to what it actually contains — the summed curve, the
   linkage and every trail — because a shared extent lets one view clip while
   another sits half empty. */
function extentFor(ax, ay, joints){
  let m = 1e-9;
  const take = q => { const a = Math.abs(q[ax]), b = Math.abs(q[ay]);
                      if(a > m) m = a; if(b > m) m = b; };
  for(const q of CURVE) take(q);
  for(const q of joints) take(q);
  for(const tr of TRAILS) if(tr) for(const q of tr) take(q);
  return m;
}

/* one flat view, looking down whichever axis is not named */
function draw2D(id, ax, ay, joints){
  const cv = $(id); if(!cv) return;
  const {ctx, W, H} = fitCanvas(cv, 1.55);
  const cx = W/2, cy = H/2;
  const S = (Math.min(W, H) * 0.46) / (extentFor(ax, ay, joints) * 1.06);
  const X = v => cx + v*S, Y = v => cy - v*S;
  ctx.strokeStyle = col("--rule2"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy);
  ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
  if(CURVE.length > 1){
    ctx.beginPath();
    CURVE.forEach((p, i) => i ? ctx.lineTo(X(p[ax]), Y(p[ay])) : ctx.moveTo(X(p[ax]), Y(p[ay])));
    ctx.closePath(); ctx.strokeStyle = col("--brass"); ctx.lineWidth = 1.5; ctx.stroke();
  }
  M.P.forEach((p, j) => {                       // each integer's own path
    const op = p.opacity, tr = TRAILS[j];
    if(op <= 0 || !tr || tr.length < 2) return;
    ctx.strokeStyle = p.col; ctx.lineWidth = 1.1; ctx.globalAlpha = op;
    ctx.beginPath();
    tr.forEach((q, i) => i ? ctx.lineTo(X(q[ax]), Y(q[ay])) : ctx.moveTo(X(q[ax]), Y(q[ay])));
    ctx.stroke(); ctx.globalAlpha = 1;
  });
  M.P.forEach((p, j) => {                       // the linkage, tip to tail
    const a = joints[j], b = joints[j+1];
    ctx.strokeStyle = p.col; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(X(a[ax]), Y(a[ay])); ctx.lineTo(X(b[ax]), Y(b[ay])); ctx.stroke();
    ctx.beginPath(); ctx.arc(X(b[ax]), Y(b[ay]), 2.6, 0, 7); ctx.fillStyle = p.col; ctx.fill();
  });
  const tip = joints[joints.length - 1];
  ctx.beginPath(); ctx.arc(X(tip[ax]), Y(tip[ay]), 5, 0, 7);
  ctx.fillStyle = col("--brass"); ctx.strokeStyle = col("--panel"); ctx.lineWidth = 2;
  ctx.fill(); ctx.stroke();
}

function draw(ts){
  const dt = (LAST == null || !ts) ? 0 : Math.min((ts - LAST) / 1000, 0.1);
  if(ts) LAST = ts;
  if(!still() && !DRAG) T += M.period * FREQ * dt;

  /* reroll every green once per slot — Inner, Fold and Outer alike. the new
     roll is eased into over the slot rather than snapped to, so a green moves
     the tip smoothly instead of teleporting it. */
  const slotF = DIVS ? frac() * DIVS : 0;
  const slot = Math.floor(slotF);
  const stale = !DRAWN || DRAWN.length !== M.P.length;
  const roll = () => M.P.map(p => still() || !p.greens
    ? {N: p.inner, S: p.outer, E: p.fold}
    : {N: rolled(p.R.inner) * p.ring, S: rolled(p.R.outer) * p.ring,
       E: rolled(p.R.fold) * p.ring});
  if(still()){ DRAWN = M.P.map(p => ({N: p.inner, S: p.outer, E: p.fold})); PREV = DRAWN; }
  else if(!DIVS){ if(stale){ DRAWN = roll(); PREV = DRAWN; } }
  else if(slot !== LASTSLOT || stale){
    LASTSLOT = slot;
    PREV = stale ? null : DRAWN;      // ease out of where we actually were
    DRAWN = roll();
    if(!PREV) PREV = DRAWN;
  }
  /* smoothstep across the slot: flat at both ends, so consecutive slots join
     without a kink. a lap moves DIVS slots, so this never lags the sweep. */
  const u = DIVS ? Math.min(1, Math.max(0, slotF - slot)) : 1;
  const e = u * u * (3 - 2 * u);
  const live = DRAWN.map((d, j) => {
    const a = PREV[j] || d;
    return {N: a.N + (d.N - a.N) * e,      // north reach
            S: a.S + (d.S - a.S) * e,      // south reach
            E: a.E + (d.E - a.E) * e};     // equator radius
  });

  const joints = [{x:0, y:0, z:0}];
  { let x = 0, y = 0, z = 0;
    M.P.forEach((p, j) => {
      const A = angleA(p, T), B = angleB(p, T), L = live[j];
      const sB = Math.sin(B), rr = L.E * Math.cos(B);
      const m = (L.N + L.S)/2, dd = (L.N - L.S)/2;
      x += rr*Math.cos(A); y += rr*Math.sin(A); z += m*sB + dd*Math.abs(sB);
      joints.push({x, y, z});
    }); }
  /* remember where every joint has been, so each integer leaves a path */
  if(TRAILS.length !== M.P.length) TRAILS = M.P.map(() => []);
  M.P.forEach((p, j) => {
    const q = joints[j + 1], tr = TRAILS[j];
    const last = tr[tr.length - 1];
    if(!last || Math.hypot(q.x - last.x, q.y - last.y, q.z - last.z) > 1e-6)
      tr.push({x: q.x, y: q.y, z: q.z});
    if(tr.length > TRAIL_MAX) tr.splice(0, tr.length - TRAIL_MAX);
  });

  const tip = joints.at(-1);
  drawSphere(tip, joints);

  /* the pinned gallery: only the page that is showing */
  if(TOPPAGE === 1){
    drawWave("wavex", WX, AVGX);
    drawWave("wavey", WY, AVGY);
    drawWave("wavez", WZ, AVGZ);
    draw2D("wubxy", "x", "y", joints);    // down k
    draw2D("wubyz", "y", "z", joints);    // down i
    draw2D("wubzx", "z", "x", joints);    // down j
    const turns = windingOf();
    helixOn($("chelix"), turns, col("--brass"), ts || 0);
    const wf = $("windfoot");
    if(wf) wf.textContent = `${turns} turn${turns === 1 ? "" : "s"} per period`;
  }
  /* and each card, only the page it is turned to */
  KS.forEach((e, i) => {
    const c = CV[i], p = M.P[i];
    if(!c || !p) return;
    const pg = e.pg || 0;
    if(pg === 1){ card1D(c.x, i, WX); card1D(c.y, i, WY); card1D(c.z, i, WZ); }
    else if(pg === 2){ card2D(c.xy, i, WX, WY); card2D(c.yz, i, WY, WZ); card2D(c.zx, i, WZ, WX); }
    else if(pg === 3){ helixOn(c.helix, p.rateA, p.col, ts || 0); }
  });
  if(typeof requestAnimationFrame === "function") requestAnimationFrame(draw);
}

/* ---- the orientation gizmo ----
   the corner cross Blender and Earth both put there. It reads the same SPIN
   and TILT the sphere does, so it is never out of step with what you see:
   drag anywhere to turn, click a ball to look straight down that axis, click
   the middle to come home. Axis colours match the tip's dropped axes — X blue,
   Y red, Z green. */
const GIZ = {r: 34, pad: 52, ball: 8};
const AXCOL = {X: () => col("--blue"), Y: () => col("--red"), Z: () => col("--green")};
const AXES3 = [
  {v: [1,0,0], n: "X", pos: true},  {v: [-1,0,0], n: "X", pos: false},
  {v: [0,1,0], n: "Y", pos: true},  {v: [0,-1,0], n: "Y", pos: false},
  {v: [0,0,1], n: "Z", pos: true},  {v: [0,0,-1], n: "Z", pos: false},
];
const gizCentre = (W, H) => ({x: W - GIZ.pad, y: GIZ.pad});
/* the same projection drawSphere uses, at gizmo scale */
function gizBalls(W, H){
  const c = gizCentre(W, H);
  const ca = Math.cos(SPIN), sa = Math.sin(SPIN), ct = Math.cos(TILT), st = Math.sin(TILT);
  return AXES3.map(a => {
    const [x, y, z] = a.v, xx = x*ca - y*sa, h = x*sa + y*ca;
    return {...a, px: c.x + xx*GIZ.r, py: c.y - (z*ct - h*st)*GIZ.r, d: z*st + h*ct};
  });
}
function drawGizmo(ctx, W, H){
  const c = gizCentre(W, H);
  ctx.save();
  ctx.globalAlpha = .5;
  ctx.beginPath(); ctx.arc(c.x, c.y, GIZ.r + 13, 0, 7);
  ctx.fillStyle = col("--panel"); ctx.fill();
  ctx.strokeStyle = col("--rule"); ctx.lineWidth = 1; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.font = "600 10px 'IBM Plex Mono', monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(const b of gizBalls(W, H).sort((p, q) => p.d - q.d)){   // back to front
    const cc = AXCOL[b.n]();
    ctx.globalAlpha = .4 + .6 * (b.d + 1) / 2;                // behind reads dimmer
    if(b.pos){
      ctx.strokeStyle = cc; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(b.px, b.py); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(b.px, b.py, GIZ.ball, 0, 7);
    ctx.fillStyle = b.pos ? cc : col("--panel"); ctx.fill();
    ctx.strokeStyle = cc; ctx.lineWidth = 1.4; ctx.stroke();
    if(b.pos){ ctx.fillStyle = col("--panel"); ctx.fillText(b.n, b.px, b.py + .5); }
  }
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(c.x, c.y, 3.2, 0, 7);             // home
  ctx.fillStyle = col("--ink3"); ctx.fill();
  ctx.restore();
}
/* what the pointer landed on: a ball, "home", or nothing (so it is a drag) */
function gizHit(e){
  const cv = $("sph"), r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const c = gizCentre(r.width, r.height);
  const away = Math.hypot(x - c.x, y - c.y);
  if(away > GIZ.r + 15) return null;
  if(away < 9) return "home";
  let best = null, bd = GIZ.ball + 4;
  /* front to back, so the near ball wins when two overlap */
  for(const b of gizBalls(r.width, r.height).sort((p, q) => q.d - p.d)){
    const d = Math.hypot(x - b.px, y - b.py);
    if(d < bd){ bd = d; best = b; break; }
  }
  return best;
}
/* solve SPIN and TILT for "camera on this axis". the depth term in proj is
   q . (sin S cos T, cos S cos T, sin T), so that vector is where the camera
   sits — set it to the axis and read the two angles back off. */
function snapTo(v){
  const wrap = a => { while(a > Math.PI) a -= TAU; while(a < -Math.PI) a += TAU; return a; };
  let s, t;
  if(!v){ s = 0; t = .38; }                       // home
  else if(v[2]){ s = SPIN; t = v[2] > 0 ? Math.PI/2 : -Math.PI/2; }
  else { s = SPIN + wrap(Math.atan2(v[0], v[1]) - SPIN); t = 0; }
  SNAP = {s0: SPIN, s1: s, t0: TILT, t1: t, at: Date.now()};
  setSpin(false);
}

function drawSphere(tip, joints){
  const cv = $("sph"); if(!cv) return;
  const {ctx, W, H} = fitCanvas(cv);          // fills the viewport, not a square
  const cx = W/2, cy = H/2, unit = Math.min(W, H) * 0.42 / (RMAX || 1) * ZOOM;
  if(SNAP){
    const u = Math.min(1, (Date.now() - SNAP.at) / 380);
    const e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
    SPIN = SNAP.s0 + (SNAP.s1 - SNAP.s0) * e;
    TILT = SNAP.t0 + (SNAP.t1 - SNAP.t0) * e;
    if(u >= 1) SNAP = null;
  }
  if(!still() && !DRAG3 && !SNAP && AUTOSPIN) SPIN += 0.004;
  const ca = Math.cos(SPIN), sa = Math.sin(SPIN), ct = Math.cos(TILT), st = Math.sin(TILT);
  /* spin about the vertical, then tilt. keep the depth term: without it there
     is no front and back, and the whole thing reads as flat rings. */
  const proj = (q, R) => {
    const x = q.x*ca - q.y*sa, h = q.x*sa + q.y*ca;
    /* d is how far toward the viewer this points, as a cosine. it has to be
       normalised: everything downstream reads it as lying in [-1,1] to fade an
       alpha or size a point, and an un-normalised dot product grows with the
       coordinates. Ring scaling puts those at 1e14 and up, which drove a point
       size negative and threw IndexSizeError out of createRadialGradient --
       killing the render loop outright. */
    const mag = Math.hypot(q.x, q.y, q.z) || 1;
    return {px: cx + x*R, py: cy - (q.z*ct - h*st)*R, d: (q.z*st + h*ct) / mag};
  };
  const ring = (R, kind, ang, style, wid, dash) => {
    ctx.beginPath();
    for(let i = 0; i <= 72; i++){
      const a = i/72 * TAU;
      const q = kind === "lat"
        ? {x: Math.cos(ang)*Math.cos(a), y: Math.cos(ang)*Math.sin(a), z: Math.sin(ang)}
        : {x: Math.cos(a)*Math.cos(ang), y: Math.cos(a)*Math.sin(ang), z: Math.sin(a)};
      const pt = proj(q, R);
      i ? ctx.lineTo(pt.px, pt.py) : ctx.moveTo(pt.px, pt.py);
    }
    ctx.strokeStyle = style; ctx.lineWidth = wid;
    if(dash) ctx.setLineDash(dash);
    ctx.stroke(); ctx.setLineDash([]);
  };

  const reach = Math.hypot(tip.x, tip.y, tip.z);
  const ghost = RMEAN * unit;                     // the mean, held still to breathe against
  ctx.globalAlpha = .5;
  ring(ghost, "lat", 0, col("--ink3"), 1, [4,4]);
  ctx.beginPath(); ctx.arc(cx, cy, ghost, 0, 7);
  ctx.strokeStyle = col("--rule2"); ctx.lineWidth = 1;
  ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  const R = Math.max(reach * unit, 0.5);
  /* below the mean it has turned itself inside out; the points invert with it */
  const inverted = reach < RMEAN;
  const c = inverted ? col("--blue") : col("--red");
  if(SHELL > 0){
    ctx.globalAlpha = .26 * SHELL;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fillStyle = c; ctx.fill();
    ctx.globalAlpha = SHELL;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7);
    ctx.strokeStyle = c; ctx.lineWidth = 1.6; ctx.stroke();
    for(const lat of [-0.9, -0.45, 0, 0.45, 0.9]) ring(R, "lat", lat, c, lat === 0 ? 1.8 : 0.8);
    for(const lon of [0, Math.PI/3, 2*Math.PI/3]) ring(R, "lon", lon, c, 0.8);
    ctx.globalAlpha = 1;
  }

  M.P.forEach((p, j) => {                          // each integer's own path
    const op = p.opacity;
    if(op <= 0) return;
    const tr = TRAILS[j];
    if(!tr || tr.length < 2) return;
    ctx.strokeStyle = p.col; ctx.lineWidth = 1.3;
    for(let i = 1; i < tr.length; i++){
      const a = proj(tr[i-1], unit), b = proj(tr[i], unit);
      ctx.globalAlpha = op * (.3 + .7 * (Math.max(a.d, b.d) + 1) / 2);
      ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  if(CURVE.length > 1){                            // the curve, faded where it runs behind
    ctx.lineWidth = 1.7; ctx.strokeStyle = col("--brass");
    for(let i = 1; i < CURVE.length; i++){
      const a = proj(CURVE[i-1], unit), b = proj(CURVE[i], unit);
      ctx.globalAlpha = .34 + .66 * (Math.max(a.d, b.d) + 1) / 2;
      ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  const t  = proj(tip, unit);
  const xp = proj({x: tip.x, y: 0, z: 0}, unit);
  const yp = proj({x: 0, y: tip.y, z: 0}, unit);
  const zp = proj({x: 0, y: 0, z: tip.z}, unit);
  const axes = [[xp, col("--blue")], [yp, col("--red")], [zp, col("--green")]];
  ctx.setLineDash([3,3]); ctx.lineWidth = 1; ctx.globalAlpha = .45;
  for(const [q, cc] of axes){ ctx.strokeStyle = cc;
    ctx.beginPath(); ctx.moveTo(q.px, q.py); ctx.lineTo(t.px, t.py); ctx.stroke(); }
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  /* ---- {:} at the centre: a black body that the points light ---- */
  const lit = (joints || []).slice(1).map((q, j) => ({
    pr: proj(q, unit), p: M.P[j], u: pulseOf(M.P[j], T)
  })).filter(o => o.p);
  /* the body is an object, not a feature of the sphere: it holds its size
     while the sphere breathes, and only zoom changes it. */
  const bodyR = Math.max(7, Math.min(Math.min(W, H) * 0.035 * ZOOM, Math.min(W, H) * 0.3));
  ctx.beginPath(); ctx.arc(cx, cy, bodyR, 0, 7);
  ctx.fillStyle = "#05070B"; ctx.fill();
  ctx.save(); ctx.clip();                        // the glow stays on the body
  for(const {pr, p, u} of lit){
    const dx = pr.px - cx, dy = pr.py - cy, d = Math.hypot(dx, dy) || 1;
    const hx = cx + dx / d * bodyR * 0.62, hy = cy + dy / d * bodyR * 0.62;
    const fall = 1 / (1 + d / (bodyR * 5));      // nearer points light it more
    const a = 0.45 * fall * (0.45 + 0.55 * u);
    const H = inverted ? (p.hue + 180) % 360 : p.hue;
    const gr = ctx.createRadialGradient(hx, hy, 0, hx, hy, bodyR * 1.15);
    gr.addColorStop(0, `hsla(${H} 85% 62% / ${a.toFixed(3)})`);
    gr.addColorStop(1, `hsla(${H} 85% 62% / 0)`);
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(cx, cy, bodyR, 0, 7); ctx.fill();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, bodyR, 0, 7);
  ctx.strokeStyle = col("--brass"); ctx.lineWidth = 1;
  ctx.globalAlpha = .5; ctx.setLineDash([3,3]); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  /* ---- the points, in whichever style is chosen ---- */
  for(const {pr, p, u} of lit){
    const near = 0.65 + 0.35 * (pr.d + 1) / 2;   // smaller when it is behind
    drawPoint(ctx, pr.px, pr.py, p.hue, 5.5 * near, u, inverted);
  }
  for(const [q, cc] of axes){
    ctx.beginPath(); ctx.arc(q.px, q.py, 4, 0, 7);
    ctx.fillStyle = cc; ctx.strokeStyle = col("--panel"); ctx.lineWidth = 1.4;
    ctx.fill(); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(t.px, t.py, 6, 0, 7);
  ctx.fillStyle = col("--brass"); ctx.strokeStyle = col("--panel"); ctx.lineWidth = 2;
  ctx.fill(); ctx.stroke();

  drawGizmo(ctx, W, H);
}

/* ---- the cards ----
   One numbered card per integer, the way a graphing calculator lists its
   expressions, each paged by its own dots. Nothing off-page is drawn. */
/* the spectrometer's cells, sized to the room the card has */
function boxes(cells, cols, rows, foldAt){
  const sz = Math.max(6, Math.min(22, Math.floor(104 / cols), Math.floor(96 / rows)));
  const gl = sz >= 9;
  const body = cells.map((v, i) => {
    const r = Math.floor(i / cols), c = i % cols;
    return `<div class="gsc ${cls(v)}${r + c === foldAt ? " fold" : ""}">${gl ? glyph(v) : ""}</div>`;
  }).join("");
  return `<div class="gsq" style="--sc:${sz}px;`
    + ` grid-template-columns:repeat(${cols},var(--sc))">${body}</div>`;
}
function page1HTML(p, e){
  const cap = p.kind === "grid"
    ? `${p.rows}\u00d7${p.cols} ${p.op === "/" ? "tableau" : "grid"}`
    : (p.mode === "op" ? `${OPNAME[p.op]}` : `${p.n}\u00d7${p.n}`);
  return `<div class="p1"><div class="gcol">`
    + boxes(p.cells, p.cols, p.rows, p.foldAt)
    + `<div class="gcap">${cap}</div></div>`
    + `<div class="tcol">${factsHTML(p, e)}</div></div>`;
}
function factsHTML(p, e){
  const gl = v => `<i class="${cls(v)}">${glyph(v)}</i>`;
  const bits = d => d.map(gl).join("");
  /* commas fall on the anti-diagonals of a square. A rectangle has no such
     arcs, so its rows are the honest grouping. */
  /* Cells, Commas and Push all describe the number, which lives on the vector
     -- for a rectangle that is its squash, not its cells read left to right. */
  const vec = p.vec || p.shown;
  const vn = Math.max(1, Math.ceil(Math.sqrt(vec.length)));
  const grouped = commas(vec, vn).map(g => bits(g)).join(`<i class="cma">,</i>`);
  const U = pushLeft(vec);
  const opLine = p.mode === "op"
    ? `<dt>Op</dt><dd><b>${OPSYM[p.op]} ${e.k}</b>`
      + (p.E ? ` \u00b7 ring 2<sup>${p.E}</sup>` : "")
      + (p.op === "/" && p.rem
          ? ` \u00b7 R ${fmt(p.rem)}${p.exact ? " (exact)" : ""}` : "")
      + `</dd>`
    : "";
  return `<dl class="facts">`
    + opLine
    + `<dt>Inner</dt><dd>${p.inner.toFixed(6)}</dd>`
    + `<dt>Fold</dt><dd>${p.fold.toFixed(6)}</dd>`
    + `<dt>Outer</dt><dd>${p.outer.toFixed(6)}</dd>`
    + `<dt>Value</dt><dd><b>${fmt(p.value)}</b> \u00b7 ${Math.round(p.nm)} nm`
      + ` \u00b7 ${p.greens} green</dd>`
    + `<dt>Cells</dt><dd class="bits">${bits(vec)} \u00b7 ${vec.length}`
      + `${p.kind === "grid" ? ` squashed from ${p.rows}\u00d7${p.cols}` : ` in ${p.n}\u00d7${p.n}`}</dd>`
    + `<dt>Commas</dt><dd class="bits">${grouped}</dd>`
    + `<dt>Push</dt><dd class="bits">${bits(U)} = ${fmt(hexValue(U))}</dd>`
    + `</dl>`;
}

function showPage(card, q){
  card.querySelectorAll(".dpg").forEach(pg => { pg.hidden = +pg.dataset.p !== q; });
  card.querySelectorAll(".dots .dt").forEach(d =>
    d.classList[+d.dataset.p === q ? "add" : "remove"]("on"));
}

let REPAINT = [];
function repaintAll(){ REPAINT.forEach(f => f()); }

function cards(){
  const el = $("cards");
  const keep = el.scrollTop;
  el.innerHTML = KS.map((e, i) => `
    <div class="dcard" data-i="${i}">
      <div class="dgut"><span class="dnum">${i + 1}</span><span class="dot"></span></div>
      <div class="dmain">
        <div class="dhead">
          <span class="knum">
            <input type="text" class="kin" value="${e.k}" spellcheck="false" aria-label="Integer">
            <span class="kspin">
              <button class="kup" tabindex="-1" aria-label="Increase by one">&#9650;</button>
              <button class="kdn" tabindex="-1" aria-label="Decrease by one">&#9660;</button>
            </span>
          </span>
          <button class="rm" aria-label="Remove">\u00d7</button>
        </div>
        <div class="seg" role="group" aria-label="How this card reads">
          ${[["plain", "plain"], ["pushed", "pushed"]].map(([m, lab]) =>
            `<button class="sg${(e.mode || "plain") === m ? " on" : ""}" data-m="${m}"`
            + ` aria-pressed="${(e.mode || "plain") === m}">${lab}</button>`).join("")}
          ${["+", "-", "*", "/"].map(o =>
            `<button class="sg op${(e.mode === "op" && (e.op || "+") === o) ? " on" : ""}"`
            + ` data-m="op" data-o="${o}"${i === 0 ? " disabled" : ""}`
            + ` aria-label="${OPNAME[o]}"`
            + ` aria-pressed="${e.mode === "op" && (e.op || "+") === o}">${OPSYM[o]}</button>`).join("")}
        </div>
        <div class="dpg" data-p="0"></div>
        <div class="dpg" data-p="1" hidden><div class="dgrid">
          <canvas data-k="x" role="img" aria-label="X over one period"></canvas>
          <canvas data-k="y" role="img" aria-label="Y over one period"></canvas>
          <canvas data-k="z" role="img" aria-label="Z over one period"></canvas></div></div>
        <div class="dpg" data-p="2" hidden><div class="dgrid">
          <canvas data-k="xy" role="img" aria-label="Seen down Z"></canvas>
          <canvas data-k="yz" role="img" aria-label="Seen down X"></canvas>
          <canvas data-k="zx" role="img" aria-label="Seen down Y"></canvas></div></div>
        <div class="dpg" data-p="3" hidden>
          <canvas class="solo" data-k="helix" role="img" aria-label="This integer as a helix"></canvas></div>
        <div class="dots">
          ${[0, 1, 2, 3].map(q =>
            `<button class="dt${(e.pg || 0) === q ? " on" : ""}" data-p="${q}"`
            + ` aria-label="${["facts", "1D", "2D", "helix"][q]}"></button>`).join("")}
        </div>
      </div>
    </div>`).join("");

  CV = []; REPAINT = [];
  el.querySelectorAll(".dcard").forEach(card => {
    const i = +card.dataset.i, p = M.P[i];
    const paint = () => {
      const q = M.P.find(x => x.row === i);
      card.querySelector(`.dpg[data-p="0"]`).innerHTML = q ? page1HTML(q, KS[i])
        : `<div class="rval dim">${KS[i]._note || "nothing to show"}</div>`;
      const dt = card.querySelector(".dgut .dot");
      if(dt) dt.style.background = q ? q.col : "transparent";
    };
    paint();
    REPAINT.push(paint);

    const cv = {};
    card.querySelectorAll("canvas").forEach(c => { cv[c.dataset.k] = c; });
    CV[i] = cv;

    const kin = card.querySelector(".kin");
    /* an integer downstream of an operand changes every card below it, so a
       keystroke repaints the whole list rather than just this one */
    const setK = v => { KS[i].k = v; kin.value = v; refresh(); };
    kin.addEventListener("input", ev => {
      const v = parseInt(ev.target.value, 10);
      if(!isNaN(v)){ KS[i].k = v; recompute(); repaintAll(); TRAILS = []; }
    });
    kin.addEventListener("keydown", ev => {
      if(ev.key === "ArrowUp"){ setK((parseInt(kin.value, 10) || 0) + 1); ev.preventDefault(); }
      if(ev.key === "ArrowDown"){ setK((parseInt(kin.value, 10) || 0) - 1); ev.preventDefault(); }
    });
    card.querySelector(".kup").addEventListener("click", () => setK((parseInt(kin.value, 10) || 0) + 1));
    card.querySelector(".kdn").addEventListener("click", () => setK((parseInt(kin.value, 10) || 0) - 1));
    card.querySelector(".rm").addEventListener("click", () => {
      if(KS.length > 1){ KS.splice(i, 1); refresh(); }
    });
    card.querySelectorAll(".seg .sg").forEach(b => {
      if(b.disabled) return;
      b.addEventListener("click", () => {
        KS[i].mode = b.dataset.m;
        if(b.dataset.o) KS[i].op = b.dataset.o;   // picking an operator IS picking operand
        refresh();
      });
    });
    card.querySelectorAll(".dots .dt").forEach(d => {
      d.addEventListener("click", () => { KS[i].pg = +d.dataset.p; showPage(card, KS[i].pg); });
    });
    showPage(card, KS[i].pg || 0);
  });
  el.scrollTop = keep;
}

function stats(){
  const box = $("stats");
  if(!box) return;                 // this page lists its facts on the cards instead
  const tot = M.P.reduce((s, p) => s + p.greens, 0);
  box.innerHTML = [
    ["Phasors", `${M.N}`, `spaced ${M.N ? (360/M.N).toFixed(0) : "—"}° apart`],
    ["Period", `${M.period.toFixed(3)} rad`, M.g ? `gcd of the rates is ${M.g}` : "no turning phasors"],
    ["Reach", `${RMAX.toFixed(4)}`, `mean ${RMEAN.toFixed(4)} — the sphere breathes between them`],
    ["Greens", `${tot}`, tot
      ? `rerolled ${DIVS || "once"}${DIVS ? " /lap" : ""} · ${Math.round((BIAS + 1) / 2 * 100)}% blue`
      : "nothing undecided"],
    ["Knots", `${M.P.filter(p => knotOf(p).knotted).length} / ${M.N}`,
      M.N ? M.P.map(p => knotOf(p).name).join(" · ") : "no phasors"],
    ["Crossings", BOUND === null ? "measuring\u2026" : `\u2264 ${BOUND}`,
      BOUND === null ? "settles a moment after the last change"
        : BOUND === 0 ? "no projection crossed itself \u2014 the sum is unknotted"
        : `best of ${CROSS_DIRS} projections \u2014 an upper bound, not the crossing number`],
  ].map(([k, v, f]) => `<div class="stat"><span class="skey">${k}</span>`
    + `<span class="sval">${v}</span><span class="sfoot">${f}</span></div>`).join("");
}

function refresh(){ recompute(); cards(); stats(); DRAWN = null; PREV = null; LASTSLOT = null; TRAILS = []; }

$("addbtn").addEventListener("click", () => {
  KS.push({k: KS.length + 2, pg: 0, mode: "plain", op: "+"});
  refresh();
  const el = $("cards");
  el.scrollTop = el.scrollHeight;       // bring the one just added into view
});
$("randbtn").addEventListener("click", () => {
  KS = KS.map(e => ({...e, k: Math.floor(Math.random()*127) - 63 || 1})); refresh();
});
$("resetbtn").addEventListener("click", () => {
  KS = [{k:3, pg:0, mode:"plain", op:"+"}, {k:5, pg:0, mode:"plain", op:"+"},
        {k:7, pg:0, mode:"plain", op:"+"}];
  refresh();
});
/* the sampled curve as plain xyz, for feeding to something that can actually
   classify it — SnapPy, KnotPlot, or anything that takes a polygonal knot. */
$("expbtn").addEventListener("click", () => {
  const head = [
    `# chronochromatic wub curve`,
    `# sequence: ${KS.map((e, i) => (i && e.mode === "op" ? OPSYM[e.op] + " " : "")
        + e.k + (e.mode === "pushed" ? "(pushed)" : "")).join(" ")}`,
    `# phasors: ${M.N}, period ${M.period} rad, samples ${CURVE.length}`,
    `# rates: ${M.P.map(p => `${p.k}:A=${p.rateA},B=${p.rateB}`).join(" ")}`,
    `# crossing bound found here: ${BOUND === null ? "not measured" : `<= ${BOUND} (best of ${CROSS_DIRS} projections)`}`,
    `# closed curve: the last point joins back to the first`,
    `# x y z`,
  ].join("\n");
  const body = CURVE.map(p => `${p.x} ${p.y} ${p.z}`).join("\n");
  const blob = new Blob([head + "\n" + body + "\n"], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `wubbadub-${KS.map(e => e.k).join("_")}.xyz`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

/* 0.1x to 60x. a linear slider would spend most of its travel above 10x, so
   the control is logarithmic and the wheel is a constant ratio per notch. */
const ZMIN = 0.1, ZMAX = 60;
const zFromSlider = v => ZMIN * Math.pow(ZMAX / ZMIN, v / 100);
const sliderFromZ = z => 100 * Math.log(z / ZMIN) / Math.log(ZMAX / ZMIN);
function setZoom(z, moveSlider){
  ZOOM = Math.max(ZMIN, Math.min(ZMAX, z));
  if(moveSlider) $("zoom").value = sliderFromZ(ZOOM);
  $("zoomval").textContent = (ZOOM < 10 ? ZOOM.toFixed(2) : ZOOM.toFixed(1)) + "×";
}
$("wid").addEventListener("input", e => {
  WIDTH = parseInt(e.target.value, 10);
  $("widval").textContent = `${WIDTH} cell${WIDTH === 1 ? "" : "s"}`;
  refresh();
});
$("topdots").addEventListener("click", e => {
  const b = e.target.closest ? e.target.closest(".dt") : null;
  if(!b) return;
  TOPPAGE = +b.dataset.p;
  document.querySelectorAll(".gal .galpg").forEach(pg => { pg.hidden = +pg.dataset.p !== TOPPAGE; });
  $("topdots").querySelectorAll(".dt").forEach(d =>
    d.classList[+d.dataset.p === TOPPAGE ? "add" : "remove"]("on"));
});
$("bias").addEventListener("input", e => {
  BIAS = parseFloat(e.target.value);
  const blue = Math.round((BIAS + 1) / 2 * 100);
  $("biasval").textContent = blue === 50 ? "50 / 50"
    : blue > 50 ? `${blue}% blue` : `${100 - blue}% red`;
});
$("shell").addEventListener("input", e => {
  SHELL = parseFloat(e.target.value);
  $("shellval").textContent = Math.round(SHELL * 100) + "%";
});
$("zoom").addEventListener("input", e => setZoom(zFromSlider(parseFloat(e.target.value)), false));
$("sph").addEventListener("wheel", e => {
  e.preventDefault();
  setZoom(ZOOM * (e.deltaY < 0 ? 1.12 : 1/1.12), true);
}, {passive: false});
setZoom(1, true);

$("speed").addEventListener("input", e => {
  FREQ = parseFloat(e.target.value);
  $("speedval").textContent = FREQ.toFixed(2) + " Hz";
});
$("jit").addEventListener("input", e => {
  DIVS = parseInt(e.target.value, 10);
  $("jitval").textContent = DIVS ? `${DIVS} /lap` : "frozen";
  LASTSLOT = null; stats();
});
const scrub = (cv, e) => {
  const r = cv.getBoundingClientRect();
  T = ((e.clientX - r.left) / r.width) * M.period;
};
for(const id of ["wubxy", "wubyz", "wubzx"]){
  const cv = $(id);
  cv.addEventListener("pointerdown", e => { DRAG = 1; scrub(cv, e); });
  cv.addEventListener("pointermove", e => { if(DRAG) scrub(cv, e); });
}
$("sph").addEventListener("pointerdown", e => {
  const hit = gizHit(e);
  if(hit){ snapTo(hit === "home" ? null : hit.v); return; }
  SNAP = null;
  setSpin(false);                       // you have the wheel now; stop drifting
  DRAG3 = {x: e.clientX, y: e.clientY, s: SPIN, t: TILT};
  /* without capture the drag dies the moment the pointer leaves the canvas,
     which is most of what made this hard to turn */
  try{ $("sph").setPointerCapture(e.pointerId); }catch(_){}
});
function setSpin(on){ AUTOSPIN = on; const b = $("autospin"); if(b) b.checked = on; }
$("autospin").addEventListener("change", e => { AUTOSPIN = e.target.checked; });
$("sph").addEventListener("pointermove", e => {
  if(!DRAG3) return;
  SPIN = DRAG3.s + (e.clientX - DRAG3.x) * 0.01;
  TILT = Math.max(-Math.PI/2, Math.min(Math.PI/2, DRAG3.t + (e.clientY - DRAG3.y) * 0.01));
});
addEventListener("pointerup", () => { DRAG = null; DRAG3 = null; });
addEventListener("pointercancel", () => { DRAG = null; DRAG3 = null; });

refresh();
if(typeof requestAnimationFrame === "function") requestAnimationFrame(draw);
</script>
</body>
</html>
