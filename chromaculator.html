<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromaculator &middot; chronochromatic.org</title>
<meta name="description" content="A card is a black body. What you type in it becomes phasors spaced evenly around it, and the bodies are packed apart on a sphere.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
html,body{height:100%}
body{overflow:hidden}
.stage{position:fixed; top:52px; left:0; right:0; bottom:0;
  display:grid; grid-template-columns:minmax(280px,26rem) 1fr}
@media (max-width:900px){
  body{overflow:auto} html,body{height:auto}
  .stage{position:static; grid-template-columns:1fr}
}
/* ---- the list, Desmos-shaped: a numbered gutter and one row per card ---- */
.list{min-height:0; display:flex; flex-direction:column;
  background:var(--panel); border-right:1px solid var(--rule)}
.bar{display:flex; align-items:center; gap:6px; padding:7px 9px;
  border-bottom:1px solid var(--rule); flex:none}
.bar .sp{flex:1}
.rows{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain}
.row{display:grid; grid-template-columns:34px 1fr 30px; align-items:stretch;
  border-bottom:1px solid var(--rule); min-height:52px}
.row.sel .gut{background:var(--brass); color:var(--panel)}
.gut{display:flex; align-items:center; justify-content:center; background:var(--sunk);
  color:var(--ink3); font-family:"IBM Plex Mono",monospace; font-size:.68rem;
  border-right:1px solid var(--rule); cursor:pointer; user-select:none}
.gut:hover{color:var(--brass)}
.inp{border:none; background:transparent; color:var(--ink); width:100%;
  font-family:"IBM Plex Mono",monospace; font-size:.95rem; padding:12px 10px;
  outline:none}
.inp:focus{background:var(--sunk)}
.del{border:none; background:transparent; color:var(--rule2); cursor:pointer;
  font-size:.9rem; line-height:1}
.del:hover{color:var(--red)}
.spell{grid-column:2 / span 2; padding:0 10px 6px}
.rowinfo{grid-column:2 / span 2; padding:0 10px 8px;
  font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink3);
  overflow-wrap:anywhere}
.rowinfo b{color:var(--ink2); font-weight:500}
.rowinfo .bad{color:var(--red)}
.rowinfo .dim{color:var(--rule2)}
.rowinfo .cut{color:var(--brass)}
/* a definition gets a knob instead of a body */
.sld{grid-column:2 / span 2; display:flex; align-items:center; gap:9px;
  padding:0 10px 9px}
.sld input[type=range]{flex:1; min-width:0; accent-color:var(--brass)}
.sld .v{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--brass);
  font-weight:600; min-width:3.2em; text-align:right}
.sld .lim{font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--ink3);
  background:var(--sunk); border:1px solid var(--rule2); border-radius:2px;
  padding:2px 4px; text-align:center}
.sld .lim:focus{color:var(--ink); outline:none; border-color:var(--brass)}
.spin{display:flex; flex-direction:column; border:1px solid var(--rule2);
  border-radius:2px; overflow:hidden}
.spin button{border:none; background:var(--sunk); color:var(--ink2); padding:0 5px;
  font-size:.5rem; line-height:1.35; border-radius:0}
.spin button:hover{background:var(--brass); color:var(--panel)}
/* plain and pushed are not a toggle: both can be on, as in Wub +- */
.spell{display:flex; gap:0; margin-left:auto}
.spell button{font-size:.58rem; padding:3px 7px; border-radius:0; margin-left:-1px}
.spell button:first-child{border-radius:2px 0 0 2px; margin-left:0}
.spell button:last-child{border-radius:0 2px 2px 0}
.spell button.on{background:var(--brass); border-color:var(--brass);
  color:var(--panel); font-weight:600}
.row.def .gut{background:var(--brass-soft); color:var(--panel)}
/* ---- the card gallery, as Wubba Dub lays it out ---- */
.gal{grid-column:2 / span 2; padding:2px 10px 10px}
.p1{display:grid; grid-template-columns:auto auto 1fr; gap:11px; align-items:start;
  padding:7px 0; border-top:1px dashed var(--rule)}
.p1:first-child{border-top:none}
@media (max-width:1100px){ .p1{grid-template-columns:1fr} }
.gsq{display:grid; gap:2px; width:max-content}
.gsc{width:var(--sc,14px); height:var(--sc,14px); display:flex; align-items:center;
  justify-content:center; border-radius:2px; border:1px solid transparent;
  font-family:"IBM Plex Mono",monospace; font-size:calc(var(--sc,14px) * .62);
  font-weight:600; line-height:1}
.gsc.b{background:var(--blue-w); color:var(--blue); border-color:var(--blue)}
.gsc.r{background:var(--red-w); color:var(--red); border-color:var(--red)}
.gsc.g{background:var(--green-w); color:var(--green); border-color:var(--green);
  opacity:.6}
.gsc.fold{box-shadow:inset 0 0 0 2px var(--brass)}
.gcol{display:flex; flex-direction:column; gap:3px; align-items:flex-start}
.gcap{font-family:"IBM Plex Mono",monospace; font-size:.55rem; color:var(--ink3)}
.tcol{min-width:0}
.facts{display:grid; grid-template-columns:auto 1fr; gap:1px 9px; margin:0;
  font-family:"IBM Plex Mono",monospace; font-size:.6rem}
.facts dt{color:var(--ink3); text-transform:uppercase; letter-spacing:.09em}
.facts dd{margin:0; color:var(--ink2); overflow-wrap:anywhere}
.facts dd b{color:var(--brass)}
.facts dd.dim{color:var(--rule2)}
.bits i{font-style:normal; font-weight:600}
.bits i.b{color:var(--blue)} .bits i.r{color:var(--red)}
.bits i.g{color:var(--rule2)}
.bits .rep{border-top:1px solid var(--brass); padding-top:1px}
.cma{color:var(--ink3); font-style:normal; padding:0 1px}
.doms{display:flex; flex-direction:column; justify-content:flex-end; min-width:54px}
.dbars{display:flex; align-items:flex-end; gap:2px}
.dbar{width:7px; height:30px; border-radius:1px}
.dbar.b{background:var(--blue)} .dbar.r{background:var(--red)}
.dbar.g{background:var(--green); opacity:.45}
.dcma{color:var(--ink3); font-size:.6rem; align-self:flex-end}
.dground{height:1px; background:var(--rule2); margin-top:3px}
.dots{display:flex; gap:6px; justify-content:center; padding:4px 0 0}
.dot{width:7px; height:7px; border-radius:50%; border:1px solid var(--rule2);
  background:transparent; padding:0; cursor:pointer}
.dot.on{background:var(--brass); border-color:var(--brass)}
.pgcv{width:100%; height:96px; display:block}
.pgrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; padding-top:6px}
.pgrow figure{margin:0; min-width:0; display:flex; flex-direction:column}
.pgrow figcaption{font-family:"IBM Plex Mono",monospace; font-size:.53rem;
  color:var(--ink3); padding-top:2px}
button{font-family:"IBM Plex Mono",monospace; font-size:.7rem; padding:5px 9px;
  cursor:pointer; background:transparent; color:var(--ink2);
  border:1px solid var(--rule2); border-radius:2px}
button:hover{border-color:var(--brass); color:var(--brass)}
button.add{border-color:var(--brass); color:var(--brass); font-size:.85rem;
  padding:3px 9px}
label.chk{display:flex; gap:5px; align-items:center; font-size:.66rem;
  color:var(--ink2); font-family:"IBM Plex Sans",sans-serif; cursor:pointer}
label.chk input{accent-color:var(--brass)}
/* ---- the field ---- */
.field{min-height:0; background:var(--paper); display:grid;
  grid-template-rows:minmax(0,1fr) auto}
.sphwrap{position:relative; min-height:0}
#sky{position:absolute; inset:0; width:100%; height:100%; display:block;
  cursor:grab; touch-action:none}
.waves{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
  padding:8px 10px 10px; border-top:1px solid var(--rule)}
@media (max-width:900px){ .waves{grid-template-columns:1fr} }
.waves figure{margin:0; background:var(--panel); border:1px solid var(--rule);
  border-radius:3px; box-shadow:var(--shadow); padding:6px 7px 4px;
  display:flex; flex-direction:column}
.waves canvas{width:100%; height:104px; display:block}
.waves figcaption{font-family:"IBM Plex Mono",monospace; font-size:.57rem;
  color:var(--ink3); letter-spacing:.06em; padding-top:3px}
.waves figcaption b{color:var(--ink2)}
#sky:active{cursor:grabbing}
.hud{position:absolute; left:12px; top:10px; font-family:"IBM Plex Mono",monospace;
  font-size:.64rem; color:var(--ink3); pointer-events:none; line-height:1.7}
.hud b{color:var(--brass)}
.err{color:var(--red); font-family:"IBM Plex Mono",monospace; font-size:.72rem;
  padding:10px}
</style>

<div class="stage">
  <div class="list">
    <div class="bar">
      <button class="add" id="add" title="add a card">+</button>
      <span class="sp"></span>
      <label class="chk"><input type="checkbox" id="collapse"> collapse to {:}</label>

      <figure><canvas id="wx"></canvas>
        <figcaption><b>X</b> <i>i</i> — round the equator</figcaption></figure>
      <figure><canvas id="wy"></canvas>
        <figcaption><b>Y</b> <i>j</i> — quadrature</figcaption></figure>
      <figure><canvas id="wz"></canvas>
        <figcaption><b>Z</b> <i>fold</i> — north and south</figcaption></figure>
    </div>

<script src="/stalk.js"></script>
<script>
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const WIDTH = 16;                    /* cells a card's items are cut to */

/* a card is a black body; what you type in it is its rack */
let CARDS = [{src: "a = 3"}, {src: "a, a*5"}, {src: "a+1, a+2, a+3"}];
let SEL = 0, T = 0, RUN = true, COLLAPSE = false;
/* the path each body's tip has walked, newest last — what makes the other
   pages read as moving rather than as a still picture */
let TRAIL = [];
const TRAIL_MAX = 260;
let SPIN = 0.6, TILT = 0.35, DRAG = null;

/* ---- sphere packing: the Fibonacci lattice ----
 * N points spread as evenly as anything gets on a sphere, with no relaxation
 * to run and no two bodies landing on each other. One body is the centre; more
 * than one and they take the shell.
 */
function sites(n){
  if(n <= 1) return [[0, 0, 0]];
  const g = Math.PI * (3 - Math.sqrt(5));       /* the golden angle */
  const out = [];
  for(let i = 0; i < n; i++){
    const y = 1 - (2 * i + 1) / n;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const a = g * i;
    out.push([r * Math.cos(a), r * Math.sin(a), y]);
  }
  return out;
}

/* ---- a knob's range, in exact ticks ----
 * The slider moves in whole ticks of `step`, so its value is min + k*step and
 * stays an exact rational — a float slider would put 0.30000000000000004 into
 * a system whose whole claim is that the value is exact.
 */
function tickOf(v, c){
  const lo = {num: BigInt(Math.round(c.lo)), den: 1n};
  const d = fDiv(fSub(v, lo), c.step);
  return Math.max(0, Math.round(Number(d.num) / Number(d.den)));
}
function valOf(c){
  const lo = {num: BigInt(Math.round(c.lo)), den: 1n};
  return fAdd(lo, fMul(c.step, {num: BigInt(c.tick), den: 1n}));
}
function ticks(c){
  const span = fSub({num: BigInt(Math.round(c.hi)), den: 1n},
                    {num: BigInt(Math.round(c.lo)), den: 1n});
  const n = fDiv(span, c.step);
  return Math.max(1, Math.round(Number(n.num) / Number(n.den)));
}

/* ---- what a card holds ---- */
let ENV = {};
/* one item, per spelling: its exact value, and the ring that value rides.
   Plain and pushed are not a toggle — both can be on, as in Wub +-, and push
   is a real second ring: it conserves the value and rewrites the cells, so the
   radius, the height and the run count all move. */
function mkItem(src, f, push){
  const p = f.den === 1n ? phasor((f.num < 0n ? "" : "") + String(f.num), push)
                         : fracPhasor(f, WIDTH);
  if(f.den !== 1n && push){
    const u = pushLeft(p.shown.slice());
    const q = phasorOf(u, p.n, {frac: f, E: p.E, exact: p.exact, rem: p.rem});
    q.dir = Math.sign(q.fold) || (f.num < 0n ? -1 : 1);
    Object.assign(p, q);
  }
  p.cells = p.shown; p.cols = p.n; p.rows = p.n; p.foldAt = p.n - 1;
  p.vec = p.shown; p.kind = "stalk"; p.mode = "num";
  p.nm = nmOf(Number(p.value.num) / Number(p.value.den));
  return {src, f, p, ok: true, push: !!push, whole: f.den === 1n,
          exact: f.den === 1n ? true : p.exact,
          rem: f.den === 1n ? {num: 0n, den: 1n} : p.rem};
}
function mkItems(src, f, spell){
  const out = [];
  if(spell.plain) out.push(mkItem(src, f, false));
  if(spell.push)  out.push(mkItem(src, f, true));
  return out.length ? out : [mkItem(src, f, false)];
}
function readCard(src, spell){
  spell = spell || {plain: true, push: false};
  const parts = String(src).split(",").map(s => s.trim()).filter(Boolean);
  const items = [];
  for(const s of parts){
    /* A variable can hold a LIST — a = 3, 5, 7 — and naming it on its own
       splices those elements in. So a variable comes in the form of int
       elements, and a card holding it holds them. In an expression a list is
       an error rather than a guess: a*2 over three values has no one answer
       that is obviously right. */
    const bare = /^[A-Za-z][A-Za-z0-9]*$/.test(s) ? ENV[s] : null;
    if(bare && bare.list){
      for(const f of bare.list) for(const it of mkItems(s, f, spell)) items.push(it);
      continue;
    }
    try{
      const f = evalFrac(s, ENV);
      /* A whole number goes through phasor() — the same path Wub +- uses, so an
         integer wubs here exactly as it does there. Cutting it to a fixed width
         instead pushed every lit bit into the top-left, left the FOLD empty,
         and the fold is the radius: the phasor had no width and only z moved,
         so the sine waves came out flat. Only a fraction needs a cut. */
      const p = f.den === 1n ? phasor(String(f.num), false)
                             : fracPhasor(f, WIDTH);
      /* whether it landed exactly belongs to the ITEM: a whole number goes
         through phasor(), which has no such field because an integer always
         does. Only a cut fraction can fall short. */
      /* the fields page1HTML wants, so a Chromaculator card is the same card
         Wubba Dub draws: dominoes, the boxed grid, and the facts */
      p.cells = p.shown; p.cols = p.n; p.rows = p.n; p.foldAt = p.n - 1;
      p.vec = p.shown; p.kind = "stalk"; p.mode = "num";
      for(const it of mkItems(s, f, spell)) items.push(it);
    }catch(e){
      items.push({src: s, ok: false, why: e.message});
    }
  }
  const good = items.filter(i => i.ok);
  /* evenly round the body: two are 180 apart, three are 120, n are 360/n */
  good.forEach((it, j) => {
    it.p.phase = TAU * j / good.length;
    it.hue = (j * 360 / Math.max(1, good.length) + 20) % 360;
    it.col = "hsl(" + it.hue.toFixed(0) + " 62% 52%)";
  });
  return {items, good};
}
/* ---- the shared midpoint {:} ----
 * A body is not parked on the lattice, it SWINGS about {:} — so a card is
 * itself a phasor one level up, and its items orbit its moving tip. Two cards
 * are 180 apart about {:}, three are 120, which is the same n-gon step the
 * items use inside a card. The whole thing is tip to tail twice over.
 *
 * A body's own phasor comes from what its card SUMS to, so the body is the
 * card's total and the points hanging off it are how it got there.
 */
function bodyPhasor(b, i, n){
  let tot = {num: 0n, den: 1n};
  for(const it of b.good) tot = fAdd(tot, it.f);
  let p;
  try{
    p = tot.den === 1n && tot.num !== 0n ? phasor(String(tot.num), false)
                                         : fracPhasor(tot, WIDTH);
  }catch(e){ p = fracPhasor({num: 1n, den: 1n}, WIDTH); }
  p.phase = TAU * i / Math.max(1, n);
  b.total = tot;
  return p;
}
/* A card that reads  name = expr  is a definition: it gets a slider instead of
   a body, and every card after it can use the name. Definitions are read in
   order, so a later one may build on an earlier one and a forward reference is
   an error rather than a silent zero. */
function buildEnv(){
  ENV = {};
  for(const c of CARDS){
    const d = defOf(c.src);
    c.def = d;
    if(!d) continue;
    try{
      const parts = d.body.split(",").map(x => x.trim()).filter(Boolean);
      /* a definition's body splices lists exactly as a card does, so lists
         compose: b = a, 9 is one longer than a */
      const vals = [];
      for(const x of parts){
        const bare = /^[A-Za-z][A-Za-z0-9]*$/.test(x) ? ENV[x] : null;
        if(bare && bare.list) vals.push(...bare.list);
        else vals.push(evalFrac(x, ENV));
      }
      /* half-typed is not wrong. "b = " has a name and no body yet, and
         reporting a raw "Cannot read properties of undefined" made adding a
         variable look broken at the moment you were doing it. */
      if(!vals.length){
        c.list = null; c.val = null; c.tick = null; c.err = null;
        c.partial = true;
        continue;
      }
      c.partial = false;
      if(vals.length > 1){
        /* a list variable: no single knob to turn, so no slider */
        c.list = vals;
        ENV[d.name] = {list: c.list};
        c.val = null; c.tick = null; c.err = null;
        continue;
      }
      c.list = null;
      /* The slider owns the value once it has one; the text sets it the first
         time and then says what the slider is for.
         The range is SYMMETRIC and yours to change. It used to be
         min(-10, v-10) .. max(10, v+10), which is ten either side of what you
         typed floored at -10..10 — so 3 gave -10..13, lopsided because the two
         guards clamp at opposite ends, and 1000 gave -10..1010, a useless
         slider. Now it is -B..B with B = max(10, |v|), and min, max and step
         are editable. */
      if(c.tick == null){
        const v0 = vals[0];
        c.step = c.step || {num: 1n, den: 1n};
        const mag = Math.abs(Number(v0.num) / Number(v0.den));
        const B = Math.max(10, Math.ceil(mag));
        c.lo = c.lo == null ? -B : c.lo;
        c.hi = c.hi == null ? B : c.hi;
        c.tick = tickOf(v0, c);
      }
      c.val = valOf(c);
      ENV[d.name] = c.val;
      c.err = null;
    }catch(e){ c.err = e.message; }
  }
}
function model(){
  buildEnv();
  /* A definition is a knob AND a body. It has a value, so it draws — typing
     a = 3 and getting an empty field was the page refusing to show the one
     thing on it. The slider is what makes it a knob; the value still wubs. */
  const bodies = CARDS.map(c => {
    const spell = {plain: c.plain !== false, push: !!c.push};
    if(!c.def) return readCard(c.src, spell);
    /* A definition that failed must not draw. buildEnv runs first and every
       definition is in ENV by the time a body is read, so a forward reference
       reported "q is not defined" and then rendered q anyway. */
    if(c.partial) return {items: [], good: [], isDef: true, name: c.def.name};
    if(c.err) return {items: [{src: c.def.body, ok: false, why: c.err}],
                      good: [], isDef: true, name: c.def.name};
    const b = readCard(c.val
      ? (c.val.den === 1n ? String(c.val.num) : c.val.num + "/" + c.val.den)
      : c.def.body, spell);
    b.isDef = true;
    b.name = c.def.name;
    return b;
  });
  /* only the cards that draw take a seat and a phase; a definition is a knob,
     not a body, so it does not consume one of the n slots */
  const pos = sites(bodies.length);
  bodies.forEach((b, i) => {
    b.seat = pos[i];
    b.bp = bodyPhasor(b, i, bodies.length);
  });
  return bodies;
}
/* ---- collapsed ----
 * Every point, at time t, measured from {:} instead of from its own body.
 * The bodies stop swinging apart and their point groups sit on the one common
 * origin — each card keeps its own phase step, so three items are still 120
 * apart, they are just drawn against the shared midpoint.
 *
 * It is NOT a sum. I built it as one first: alignByWeight adds 3, 5, 7 into a
 * single 15, which is true and is a different question. Collapsing keeps all
 * three waves and only moves where they are measured from.
 */
/* where body i is at time t: the tip of its own phasor, from {:} */
function bodyAt(b, t){
  const v = comp(b.bp, t);
  const m = b.bpMax || 1;
  return [v[0] / m, v[1] / m, v[2] / m];
}
let BODIES = model(), CURVES = [], SPAN = 1;
/* the traces the selected card's items draw over one turn: one per item, plus
   the sum, per axis. This is what Wub +- shows and what an integer looks like
   as a wave. */
let TR = [[], [], []], SUM = [[], [], []];

const SAMPLES = 360;
function recompute(){
  BODIES = model();
  CURVES = BODIES.map(b => {
    if(!b.good.length) return [];
    const c = [];
    let mx = 1e-9;
    for(let i = 0; i <= SAMPLES; i++){
      const t = TAU * i / SAMPLES;
      let x = 0, y = 0, z = 0;
      for(const it of b.good){
        const v = comp(it.p, t);
        x += v[0]; y += v[1]; z += v[2];
      }
      c.push([x, y, z]);
      mx = Math.max(mx, Math.hypot(x, y, z));
    }
    c.max = mx;
    return c;
  });
  /* each body's own swing, normalised so no card's total drowns the others */
  for(const b of BODIES){
    let m = 1e-9;
    for(let i = 0; i <= 120; i++){
      const v = comp(b.bp, TAU * i / 120);
      m = Math.max(m, Math.hypot(v[0], v[1], v[2]));
    }
    b.bpMax = m;
  }
  SPAN = Math.max(1e-9, ...CURVES.map(c => c.max || 0));
  TRAIL = BODIES.map(() => []);
  traces();
}
function traces(){
  const b = BODIES[SEL];
  TR = [[], [], []]; SUM = [[], [], []];
  if(!b || !b.good.length) return;
  TR = [b.good.map(() => []), b.good.map(() => []), b.good.map(() => [])];
  SUM = [[], [], []];
  for(let i = 0; i <= SAMPLES; i++){
    const t = TAU * i / SAMPLES;
    const s3 = [0, 0, 0];
    b.good.forEach((it, j) => {
      const v = comp(it.p, t);
      for(let k = 0; k < 3; k++){ TR[k][j].push(v[k]); s3[k] += v[k]; }
    });
    for(let k = 0; k < 3; k++) SUM[k].push(s3[k]);
  }
}

/* ---- drawing ---- */
function proj(v, cx, cy, R){
  const [x0, y0, z0] = v;
  const cs = Math.cos(SPIN), sn = Math.sin(SPIN);
  const x = x0 * cs - y0 * sn, h = x0 * sn + y0 * cs;
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  const mag = Math.hypot(x, h, z0) || 1;
  return {px: cx + x * R, py: cy - (z0 * ct - h * st) * R,
          d: (z0 * st + h * ct) / mag};
}
function fit(cv){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(r.width)), h = Math.max(2, Math.round(r.height));
  if(cv.width !== w * dpr || cv.height !== h * dpr){
    cv.width = w * dpr; cv.height = h * dpr;
  }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {g, w, h};
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function draw(){
  const cv = $("#sky"); if(!cv) return;
  const {g, w, h} = fit(cv);
  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const N = Math.max(1, BODIES.length);
  const many = N > 1;
  const S = Math.min(w, h);
  /* Size the curves as big as they FIT rather than as small as is safe. Bodies
     sit on a shell of radius SEP; two neighbours are 2*SEP*sin(pi/N) apart, so
     a curve of 0.42 of that gap can never touch its neighbour's. */
  const SEP = many ? S * 0.30 : 0;
  const gap = many ? 2 * SEP * Math.sin(Math.PI / N) : S * 0.78;
  const R = (COLLAPSE ? S * 0.36 : Math.min(gap * 0.42, S * 0.36)) / SPAN;
  const rule = css("--rule"), brass = css("--brass"), ink3 = css("--ink3"),
        blue = css("--blue"), red = css("--red"), green = css("--green");
  /* the shell the bodies swing on */
  g.strokeStyle = rule; g.lineWidth = 1; g.globalAlpha = 0.4;
  g.beginPath(); g.arc(cx, cy, SEP, 0, TAU); g.stroke(); g.globalAlpha = 1;
  /* back to front, so near bodies cover far ones */
  /* collapsed, every body sits ON {:}; open, each swings to its own tip */
  const order = BODIES.map((b, i) => ({b, i}))
    .map(o => Object.assign(o, {at: COLLAPSE ? proj([0, 0, 0], cx, cy, SEP)
                                             : proj(bodyAt(o.b, T), cx, cy, SEP)}))
    .sort((p, q) => p.at.d - q.at.d);
  if(!COLLAPSE){
    /* the spokes back to {:}, under everything */
    for(const o of order){
      g.strokeStyle = rule; g.lineWidth = 1; g.globalAlpha = 0.45;
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(o.at.px, o.at.py); g.stroke();
    }
    g.globalAlpha = 1;
  }
  for(const {b, i, at} of order){
    const near = 0.55 + 0.45 * Math.max(0, at.d);
    const bx = at.px, by = at.py;
    /* the black body — or, collapsed, nothing but the points it holds */
    const rad = Math.max(5, Math.min(w, h) * (many ? 0.032 : 0.06) * near);
    if(!COLLAPSE){
      const gr = g.createRadialGradient(bx - rad * .3, by - rad * .4, rad * .1,
                                        bx, by, rad);
      gr.addColorStop(0, css("--ink2")); gr.addColorStop(1, css("--ink"));
      g.fillStyle = gr; g.globalAlpha = near;
      g.beginPath(); g.arc(bx, by, rad, 0, TAU); g.fill();
      g.globalAlpha = 1;
    }
    g.strokeStyle = i === SEL ? brass : rule;
    g.lineWidth = i === SEL ? 2 : 1;
    g.globalAlpha = COLLAPSE ? 0.5 : 1;
    g.beginPath(); g.arc(bx, by, COLLAPSE ? 2.5 : rad, 0, TAU); g.stroke();
    g.globalAlpha = 1;
    const C = CURVES[i] || [];
    if(!C.length) continue;
    /* a faint shell for the body to ride in, the way the other pages give one */
    g.strokeStyle = rule; g.lineWidth = 1; g.setLineDash([3, 4]);
    for(let k = -1; k <= 1; k++){
      const cl = Math.cos(k * Math.PI / 5), sl = Math.sin(k * Math.PI / 5);
      g.beginPath();
      for(let q = 0; q <= 60; q++){
        const a2 = TAU * q / 60;
        const pt = proj([SPAN * cl * Math.cos(a2), SPAN * cl * Math.sin(a2),
                         SPAN * sl], bx, by, R);
        q ? g.lineTo(pt.px, pt.py) : g.moveTo(pt.px, pt.py);
      }
      g.globalAlpha = near * 0.28; g.stroke();
    }
    g.setLineDash([]); g.globalAlpha = 1;
    /* the trail the tip has actually walked */
    const tr = TRAIL[i] || [];
    g.lineWidth = 2;
    for(let k = 1; k < tr.length; k++){
      const a2 = proj(tr[k - 1], bx, by, R), b2 = proj(tr[k], bx, by, R);
      g.strokeStyle = green;
      g.globalAlpha = near * (k / tr.length) * (b2.d > 0 ? 0.9 : 0.35);
      g.beginPath(); g.moveTo(a2.px, a2.py); g.lineTo(b2.px, b2.py); g.stroke();
    }
    g.globalAlpha = 1;
    /* the curve the rack traces round it */
    g.lineWidth = i === SEL ? 2 : 1.4;
    for(let k = 1; k < C.length; k++){
      const a = proj(C[k - 1], bx, by, R), q = proj(C[k], bx, by, R);
      g.strokeStyle = q.d > 0 ? brass : rule;
      g.globalAlpha = near * (q.d > 0 ? 0.9 : 0.32);
      g.beginPath(); g.moveTo(a.px, a.py); g.lineTo(q.px, q.py); g.stroke();
    }
    g.globalAlpha = 1;
    /* the chain, tip to tail, where it stands now */
    let x = 0, y = 0, z = 0;
    let prev = proj([0, 0, 0], bx, by, R);
    b.good.forEach((it, j) => {
      const v = comp(it.p, T);
      x += v[0]; y += v[1]; z += v[2];
      const q = proj([x, y, z], bx, by, R);
      const col = j % 2 ? blue : red;
      g.strokeStyle = col; g.lineWidth = 1.4;
      g.globalAlpha = near * (0.5 + 0.45 * Math.max(0, q.d));
      g.beginPath(); g.moveTo(prev.px, prev.py); g.lineTo(q.px, q.py); g.stroke();
      g.globalAlpha = near;
      g.fillStyle = col;
      g.beginPath(); g.arc(q.px, q.py, 2.4 + 1.8 * Math.max(0, q.d), 0, TAU); g.fill();
      g.globalAlpha = 1;
      prev = q;
    });
    g.fillStyle = green; g.globalAlpha = near;
    g.beginPath(); g.arc(prev.px, prev.py, 3.4, 0, TAU); g.fill();
    g.globalAlpha = 1;
    if(many){
      g.fillStyle = i === SEL ? brass : ink3;
      g.font = "600 10px 'IBM Plex Mono', monospace";
      g.textAlign = "center";
      g.fillText(String(i + 1), bx, by + rad + 13);
    }
  }
  /* {:} — the point every body swings against */
  g.strokeStyle = css("--brass"); g.fillStyle = css("--panel"); g.lineWidth = 1.5;
  g.beginPath(); g.arc(cx, cy, 6, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = css("--brass");
  g.font = "600 9px 'IBM Plex Mono', monospace";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(":", cx, cy);
  g.textBaseline = "alphabetic";
  g.fillStyle = css("--ink3"); g.font = "9px 'IBM Plex Mono', monospace";
  g.fillText("{:}", cx, cy + 19);

  drawWaves();
  const drawn = BODIES;
  const tot = drawn.reduce((a, b) => a + b.good.length, 0);
  $("#hud").innerHTML = `<b>${drawn.length}</b> black bod${drawn.length === 1
    ? "y" : "ies"} &middot; <b>${tot}</b> phasor${tot === 1 ? "" : "s"}`
    + (COLLAPSE
        ? " &middot; <b>collapsed</b> &mdash; every point measured from {:}"
        : ` &middot; swinging about <b>{:}</b> at `
          + `${Math.round(360 / Math.max(1, drawn.length))}&deg;`)
    + "<br>" + BODIES.map((b, i) => (i + 1) + ": " + b.good.length
        + (b.good.length ? " at " + Math.round(360 / b.good.length) + "&deg;" : ""))
      .filter(Boolean).join("  ");
}

/* ---- the waves ----
 * What an integer looks like as a wave, the way Wub +- shows it: one trace per
 * item in the card, in the item's own colour, and the sum over them in ink. A
 * card with 3 in it is one sine; 3, 5, 7 is three, spaced 120 apart, and the
 * heavy line is what they come to.
 */
function drawWaves(){
  const AX = ["#wx", "#wy", "#wz"];
  const b = BODIES[SEL];
  for(let k = 0; k < 3; k++){
    const cv = $(AX[k]); if(!cv) continue;
    const {g, w, h} = fit(cv);
    g.clearRect(0, 0, w, h);
    const pad = 8, iw = w - pad * 2, ih = h - pad * 2, cy = pad + ih / 2;
    g.strokeStyle = css("--rule2"); g.lineWidth = 1;
    g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(pad, cy); g.lineTo(w - pad, cy); g.stroke();
    g.setLineDash([]);
      const T2 = TR[k], S2 = SUM[k];
    if(!b || !b.good.length || !S2.length){
      g.fillStyle = css("--ink3");
      g.font = "10px 'IBM Plex Mono', monospace"; g.textAlign = "center";
      g.fillText("card " + (SEL + 1) + " is empty", w / 2, cy + 3);
      continue;
    }
    let peak = 1e-9;
    for(const tr of T2) for(const y of tr) peak = Math.max(peak, Math.abs(y));
    for(const y of S2) peak = Math.max(peak, Math.abs(y));
    const X = i => pad + i / SAMPLES * iw, Y = y => cy - y / peak * (ih / 2);
    g.lineWidth = 1.3; g.globalAlpha = 0.8;
    b.good.forEach((it, j) => {
      g.strokeStyle = it.col; g.beginPath();
      T2[j].forEach((y, i) => i ? g.lineTo(X(i), Y(y)) : g.moveTo(X(i), Y(y)));
      g.stroke();
    });
    g.globalAlpha = 1;
    g.strokeStyle = css("--ink"); g.lineWidth = 2.2; g.beginPath();
    S2.forEach((y, i) => i ? g.lineTo(X(i), Y(y)) : g.moveTo(X(i), Y(y)));
    g.stroke();
    /* where the chain stands right now */
    const ph = ((T % TAU) + TAU) % TAU / TAU;
    const idx = Math.min(SAMPLES, Math.round(ph * SAMPLES)), px = X(idx);
    g.strokeStyle = css("--ink3"); g.lineWidth = 1; g.globalAlpha = 0.7;
    g.beginPath(); g.moveTo(px, pad); g.lineTo(px, h - pad); g.stroke();
    g.globalAlpha = 1;
    b.good.forEach((it, j) => {
      g.fillStyle = it.col;
      g.beginPath(); g.arc(px, Y(T2[j][idx]), 2.6, 0, TAU); g.fill();
    });
    g.fillStyle = css("--ink"); g.strokeStyle = css("--panel"); g.lineWidth = 2;
    g.beginPath(); g.arc(px, Y(S2[idx]), 4, 0, TAU); g.fill(); g.stroke();
  }
}

/* ---- the list ---- */
/* Repainting rebuilds every row, which throws away the input the caret is in —
   and the keystroke that turns a card into a definition is exactly the one that
   repaints. Typing "b = 5" died on the "=" and the variable could never be
   finished. So remember where the caret was and put it back. */
function paint(){
  const host = $("#rows");
  const act = document.activeElement;
  const keep = act && act.classList && act.classList.contains("inp")
    ? {i: +act.dataset.i, a: act.selectionStart, b: act.selectionEnd} : null;
  host.textContent = "";
  CARDS.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "row" + (i === SEL ? " sel" : "");
    const gut = document.createElement("div");
    gut.className = "gut"; gut.textContent = String(i + 1);
    gut.addEventListener("click", () => { SEL = i; traces(); paint(); });
    const inp = document.createElement("input");
    inp.className = "inp"; inp.value = c.src; inp.spellcheck = false;
    inp.dataset.i = String(i);
    inp.placeholder = "3, 5, 7  or  (13*3*127/2^4)";
    inp.addEventListener("input", () => {
      /* editing the text hands control back to it; the slider takes over again
         once buildEnv has read a value out of the new text */
      const wasDef = !!CARDS[i].def;
      CARDS[i].src = inp.value;
      CARDS[i].tick = null; CARDS[i].lo = null; CARDS[i].hi = null;
      SEL = i;
      recompute();
      /* the gallery holds the dominoes, the grid and the facts, and it was
         never refreshed on a keystroke — so the sphere followed the number and
         the card kept showing the old one */
      if(wasDef !== !!CARDS[i].def) paint(); else { info(); gallery(); }
    });
    inp.addEventListener("focus", () => { SEL = i; traces(); paint(); });
    const del = document.createElement("button");
    del.className = "del"; del.innerHTML = "&times;"; del.title = "remove";
    del.addEventListener("click", () => {
      CARDS.splice(i, 1);
      if(!CARDS.length) CARDS.push({src: ""});
      SEL = Math.min(SEL, CARDS.length - 1);
      recompute(); paint();
    });
    const nfo = document.createElement("div");
    nfo.className = "rowinfo"; nfo.id = "nfo" + i;
    const spell = document.createElement("div");
    spell.className = "spell";
    for(const [k2, lab] of [["plain", "PLAIN"], ["push", "PUSHED"]]){
      const b2 = document.createElement("button");
      b2.textContent = lab;
      if(c[k2] === undefined) c[k2] = (k2 === "plain");
      if(c[k2]) b2.className = "on";
      b2.addEventListener("click", () => {
        CARDS[i][k2] = !CARDS[i][k2];
        if(!CARDS[i].plain && !CARDS[i].push) CARDS[i].plain = true;
        SEL = i; recompute(); paint();
      });
      spell.appendChild(b2);
    }
    row.appendChild(gut); row.appendChild(inp); row.appendChild(del);
    row.appendChild(spell);
    /* an errored definition has no range to slide: lo and hi were never set,
       and ticks() then reached BigInt(NaN) */
    if(c.def && !c.list && !c.partial && !c.err && c.val){
      row.className += " def";
      const sld = document.createElement("div");
      sld.className = "sld";
      const num = (val, w, on) => {
        const e = document.createElement("input");
        e.type = "text"; e.className = "lim"; e.value = String(val);
        e.style.width = w;
        e.addEventListener("change", () => { on(e.value); recompute(); paint(); });
        return e;
      };
      sld.appendChild(num(c.lo, "3em", v => {
        const n = parseFloat(v);
        if(isFinite(n)) { CARDS[i].lo = Math.round(n); CARDS[i].tick = null; }
      }));
      const rng = document.createElement("input");
      rng.type = "range";
      rng.min = "0"; rng.max = String(ticks(c)); rng.step = "1";
      rng.value = String(c.tick);
      const v = document.createElement("span");
      v.className = "v";
      v.textContent = c.val.den === 1n ? String(c.val.num)
        : c.val.num + "/" + c.val.den;
      rng.addEventListener("input", () => {
        CARDS[i].tick = +rng.value;
        CARDS[i].val = valOf(CARDS[i]);
        v.textContent = CARDS[i].val.den === 1n ? String(CARDS[i].val.num)
          : CARDS[i].val.num + "/" + CARDS[i].val.den;
        SEL = i; recompute(); info(); gallery();
      });
      sld.appendChild(rng);
      sld.appendChild(num(c.hi, "3em", x => {
        const n = parseFloat(x);
        if(isFinite(n)) { CARDS[i].hi = Math.round(n); CARDS[i].tick = null; }
      }));
      sld.appendChild(v);
      const st = document.createElement("input");
      st.type = "text"; st.className = "lim"; st.style.width = "3.4em";
      st.title = "step";
      st.value = c.step.den === 1n ? String(c.step.num)
        : c.step.num + "/" + c.step.den;
      st.addEventListener("change", () => {
        try{
          const f = evalFrac(st.value);
          if(f.num > 0n){ CARDS[i].step = f; CARDS[i].tick = null; }
        }catch(e){}
        recompute(); paint();
      });
      sld.appendChild(st);
      /* an integer stepper, the way Wubba Dub's card has one: the slider is
         for sweeping, the stepper is for landing on a number */
      const bump = d => {
        const c2 = CARDS[i];
        c2.tick = Math.max(0, Math.min(ticks(c2), c2.tick + d));
        c2.val = valOf(c2);
        SEL = i; recompute(); paint();
      };
      const sp = document.createElement("div");
      sp.className = "spin";
      for(const [lab, d] of [["\u25b4", 1], ["\u25be", -1]]){
        const b2 = document.createElement("button");
        b2.textContent = lab;
        b2.addEventListener("click", () => bump(d));
        sp.appendChild(b2);
      }
      sld.appendChild(sp);
      row.appendChild(sld);
    }
    row.appendChild(nfo);
    /* the gallery: page 0 is the number itself — dominoes, grid, facts */
    const gal = document.createElement("div");
    gal.className = "gal"; gal.id = "gal" + i;
    row.appendChild(gal);
    const dots = document.createElement("div");
    dots.className = "dots";
    PAGES.forEach((nm2, k) => {
      const d = document.createElement("button");
      d.className = "dot" + ((c.page || 0) === k ? " on" : "");
      d.title = nm2;
      d.addEventListener("click", () => {
        CARDS[i].page = k; SEL = i; traces(); paint();
      });
      dots.appendChild(d);
    });
    row.appendChild(dots);
    host.appendChild(row);
  });
  info();
  gallery();
  if(keep){
    const back = host.querySelectorAll(".inp")[keep.i];
    if(back){
      back.focus();
      try{ back.setSelectionRange(keep.a, keep.b); }catch(e){}
    }
  }
}
const PAGES = ["the number", "1D X Y Z", "2D XY XZ YZ"];
/* page 0 is the number itself, drawn by the same page1HTML Wubba Dub uses.
   Pages 1 and 2 are its projections, one small canvas each. */
function gallery(){
  BODIES.forEach((b, i) => {
    const host = document.getElementById("gal" + i);
    if(!host) return;
    const pg = (CARDS[i] && CARDS[i].page) || 0;
    if(!b.good.length){ host.innerHTML = ""; return; }
    if(pg === 0){
      host.innerHTML = b.good.map(it => page1HTML(it.p, {k: it.src})).join("");
      return;
    }
    const set = pg === 1 ? ["X", "Y", "Z"] : ["XY", "XZ", "YZ"];
    host.innerHTML = '<div class="pgrow">' + set.map((nm2, k) =>
      `<figure><canvas class="pgcv" id="cv${i}_${k}"></canvas>`
      + `<figcaption>${nm2}</figcaption></figure>`).join("") + "</div>";
  });
}
/* the card's own projections, drawn every frame like the field is */
function drawGallery(){
  BODIES.forEach((b, i) => {
    const pg = (CARDS[i] && CARDS[i].page) || 0;
    if(!pg || !b.good.length) return;
    const AXES = pg === 1 ? [[0], [1], [2]] : [[0, 1], [0, 2], [1, 2]];
    AXES.forEach((ax, k) => {
      const cv = document.getElementById("cv" + i + "_" + k);
      if(!cv) return;
      const {g, w, h} = fit(cv);
      g.clearRect(0, 0, w, h);
      const pad = 5;
      /* one pass to find the extent, so each panel fills itself */
      let mx = 1e-9;
      const pts = [];
      for(let q = 0; q <= SAMPLES; q++){
        const t = TAU * q / SAMPLES;
        let v = [0, 0, 0];
        for(const it of b.good){ const c = comp(it.p, t);
          v = [v[0] + c[0], v[1] + c[1], v[2] + c[2]]; }
        pts.push(v);
        for(const a of ax) mx = Math.max(mx, Math.abs(v[a]));
      }
      g.strokeStyle = css("--rule"); g.lineWidth = 1;
      if(ax.length === 1){
        g.beginPath(); g.moveTo(pad, h / 2); g.lineTo(w - pad, h / 2); g.stroke();
        g.strokeStyle = css("--brass"); g.lineWidth = 1.5; g.beginPath();
        pts.forEach((v, q) => {
          const px = pad + q / SAMPLES * (w - pad * 2);
          const py = h / 2 - v[ax[0]] / mx * (h / 2 - pad);
          q ? g.lineTo(px, py) : g.moveTo(px, py);
        });
        g.stroke();
        const idx = Math.min(SAMPLES, Math.round(((T % TAU) + TAU) % TAU / TAU * SAMPLES));
        g.fillStyle = css("--green");
        g.beginPath();
        g.arc(pad + idx / SAMPLES * (w - pad * 2),
              h / 2 - pts[idx][ax[0]] / mx * (h / 2 - pad), 3, 0, TAU);
        g.fill();
        return;
      }
      const cx2 = w / 2, cy2 = h / 2, R2 = Math.min(w, h) / 2 - pad;
      g.beginPath(); g.moveTo(pad, cy2); g.lineTo(w - pad, cy2);
      g.moveTo(cx2, pad); g.lineTo(cx2, h - pad); g.stroke();
      g.strokeStyle = css("--brass"); g.lineWidth = 1.5; g.beginPath();
      pts.forEach((v, q) => {
        const px = cx2 + v[ax[0]] / mx * R2, py = cy2 - v[ax[1]] / mx * R2;
        q ? g.lineTo(px, py) : g.moveTo(px, py);
      });
      g.stroke();
      const idx = Math.min(SAMPLES, Math.round(((T % TAU) + TAU) % TAU / TAU * SAMPLES));
      g.fillStyle = css("--green");
      g.beginPath();
      g.arc(cx2 + pts[idx][ax[0]] / mx * R2, cy2 - pts[idx][ax[1]] / mx * R2,
            3, 0, TAU);
      g.fill();
    });
  });
}
/* what each card came to, said exactly */
function info(){
  BODIES.forEach((b, i) => {
    const el = document.getElementById("nfo" + i);
    if(!el) return;
    const c = CARDS[i];
    if(c && c.def){
      el.innerHTML = c.partial
        ? `<span class="dim">${c.def.name} = &hellip;</span>`
        : c.err ? `<span class="bad">${c.err}</span>`
        : c.list
          ? `<b>${c.def.name}</b> = ${c.list.map(f => f.den === 1n ? f.num
              : f.num + "/" + f.den).join(", ")} &mdash; ${c.list.length} elements`
          : `<b>${c.def.name}</b> = ${c.val.den === 1n ? c.val.num
              : c.val.num + "/" + c.val.den} &mdash; a knob`;
      return;
    }
    el.innerHTML = b.items.map(it => {
      if(!it.ok) return `<span class="bad">${it.src} &mdash; ${it.why}</span>`;
      const f = it.f;
      const v = f.den === 1n ? String(f.num) : f.num + "/" + f.den;
      return "<b>" + v + "</b>" + (it.exact ? "" :
        ` <span class="cut">cut to ${WIDTH}, rem ${it.rem.num}/${it.rem.den}</span>`);
    }).join(" &middot; ");
  });
}

/* ---- input ---- */
$("#add").addEventListener("click", () => {
  CARDS.push({src: ""}); SEL = CARDS.length - 1; recompute(); paint();
  const rows = $("#rows").querySelectorAll(".inp");
  if(rows.length) rows[rows.length - 1].focus();
});
$("#run").addEventListener("change", e => { RUN = e.target.checked; });
$("#collapse").addEventListener("change", e => { COLLAPSE = e.target.checked; });
$("#reset").addEventListener("click", () => { SPIN = 0.6; TILT = 0.35; });
const sky = $("#sky");
if(sky){
  sky.addEventListener("pointerdown", e => {
    DRAG = {x: e.clientX, y: e.clientY, s: SPIN, t: TILT};
    sky.setPointerCapture(e.pointerId);
  });
  sky.addEventListener("pointermove", e => {
    if(!DRAG) return;
    SPIN = DRAG.s + (e.clientX - DRAG.x) * 0.008;
    TILT = Math.max(-1.5, Math.min(1.5, DRAG.t + (e.clientY - DRAG.y) * 0.006));
  });
  sky.addEventListener("pointerup", () => { DRAG = null; });
  sky.addEventListener("pointercancel", () => { DRAG = null; });
}

let LAST = null;
function frame(ts){
  if(LAST == null) LAST = ts;
  const dt = Math.min(0.05, (ts - LAST) / 1000); LAST = ts;
  if(RUN){
    T += dt * 0.9;
    if(!DRAG) SPIN += dt * 0.09;
    BODIES.forEach((b, i) => {
      if(!b.good.length) return;
      let x = 0, y = 0, z = 0;
      for(const it of b.good){ const v = comp(it.p, T); x += v[0]; y += v[1]; z += v[2]; }
      if(!TRAIL[i]) TRAIL[i] = [];
      TRAIL[i].push([x, y, z]);
      while(TRAIL[i].length > TRAIL_MAX) TRAIL[i].shift();
    });
  }
  draw();
  drawGallery();
  requestAnimationFrame(frame);
}
recompute();
paint();
requestAnimationFrame(frame);
</script>
